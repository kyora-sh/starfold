<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
		<!-- The server fills in the title (index_html in src/server.rs). -->
		<meta name="application-name" content="{{title}}" />
		<meta name="apple-mobile-web-app-title" content="{{title}}" />
		<link rel="icon" href="favicon.ico" />
		<link
			rel="preload"
			href="inter.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<title>{{title}}</title>
		<style>
			/* Inter (latin subset of the variable font, SIL OFL 1.1; see inter-LICENSE.txt), from upstream voxl. */
			@font-face {
				font-family: 'Inter';
				src: url(inter.woff2) format('woff2');
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}
			/* Dark theme tokens, from upstream voxl (MIT). */
			:root {
				--surface-raised: #212121;
				--surface-secondary: #383838;
				--text-title: #ffffffeb;
				--text-strong: #ffffffcc;
				--text-default: #ffffffb8;
				--text-weak: #ffffff80;
				--text-muted: #ffffff3d;
				--icon-title: #e0e0e0;
				--icon-strong: #b8b8b8;
				--icon-default: #9e9e9e;
				--state-hover: #ffffff14;
				--state-pressed: #ffffff29;
				--fill-tertiary: #ffffff14;
				--fill-tertiary-hover: #ffffff1f;
				--fill-tertiary-pressed: #ffffff33;
				--fill-primary: #5c5c5c;
				--fill-primary-hover: #858585;
				--fill-primary-pressed: #9e9e9e;
				--border-default: #ffffff0f;
				--accent: #118af3;
				--accent-subtle: #0083f514;
				--positive: #25b134;
				--negative: #f15555;
				--focus-ring:
					0 0 0 1px #009eff,
					0 0 0 2px color-mix(in srgb, #009eff 24%, transparent);
				--shadow-white-border:
					0 0 4px 0 rgba(0, 0, 0, 0.04), 0 0 2px 0 rgba(0, 0, 0, 0.06),
					0 0 1px 0 rgba(0, 0, 0, 0.1);
				--shadow-lg:
					0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
				--font:
					'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
					sans-serif;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				overscroll-behavior: none;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				-webkit-font-smoothing: antialiased;
			}
			#surface {
				position: relative;
				outline: none;
				touch-action: none;
			}
			#screen {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				pointer-events: none;
			}
			.stripe {
				position: absolute;
				left: 0;
				width: 100%;
				display: block;
				pointer-events: none;
				object-fit: fill;
			}
			/* On-screen so mobile browsers will open the soft keyboard for it. */
			#kbd {
				position: fixed;
				left: 0;
				bottom: 0;
				width: 1px;
				height: 1px;
				opacity: 0.01;
				border: 0;
				padding: 0;
				resize: none;
				pointer-events: none;
				font-size: 16px;
			}
			svg.i {
				width: 16px;
				height: 16px;
				padding: 2px;
				box-sizing: content-box;
				flex: none;
				color: var(--icon-default);
			}
			button {
				font: inherit;
				color: inherit;
			}
			button:focus-visible {
				outline: none;
				box-shadow: var(--focus-ring);
			}

			/* Toolbar: ghost icon buttons in a frosted bar, like the app's tooltip surface. */
			#tools {
				position: fixed;
				top: 8px;
				right: 8px;
				display: flex;
				gap: 2px;
				padding: 2px;
				z-index: 3;
				opacity: 0;
				transition: opacity 0.1s;
				pointer-events: none;
				background: color-mix(in srgb, var(--surface-raised) 90%, transparent);
				border: 1.5px solid var(--border-default);
				border-radius: 12px;
				box-shadow:
					0 20px 25px -5px rgba(0, 0, 0, 0.1),
					0 8px 10px -6px rgba(0, 0, 0, 0.1);
				backdrop-filter: blur(30px);
				-webkit-backdrop-filter: blur(30px);
			}
			#tools.show {
				opacity: 1;
				pointer-events: auto;
			}
			#tools.touch {
				top: auto;
				bottom: 12px;
			}
			.ib {
				width: 28px;
				height: 28px;
				border: 0;
				padding: 0;
				border-radius: 8px;
				background: transparent;
				display: inline-grid;
				place-items: center;
				cursor: pointer;
				transition:
					transform 0.15s ease-out,
					background-color 0.15s ease-out;
			}
			.ib:hover {
				background: var(--state-hover);
			}
			.ib:active {
				background: var(--state-pressed);
				transform: scale(0.97);
			}
			.ib:hover svg.i,
			.ib.on svg.i {
				color: var(--icon-title);
			}
			.ib.sm {
				width: 24px;
				height: 24px;
			}
			#tools.touch .ib {
				width: 40px;
				height: 40px;
			}
			#tools.touch .ib svg.i {
				width: 20px;
				height: 20px;
			}
			#kb-btn,
			#files-btn,
			#mic-btn {
				display: none !important;
			}
			#tools.touch #kb-btn,
			#tools.files #files-btn,
			#tools.mic #mic-btn {
				display: inline-grid !important;
			}
			/* Read-only: nothing on the desktop accepts what the keyboard would send. */
			#tools.read-only #kb-btn {
				display: none !important;
			}
			/* While the microphone is live the toolbar stays up as a recording indicator. */
			#tools.mic-on {
				opacity: 1;
				pointer-events: auto;
			}
			#mic-btn .on,
			#mic-btn.on .off {
				display: none;
			}
			#mic-btn.on .on {
				display: block;
			}
			#mic-btn.on,
			#mic-btn.on:hover {
				background: color-mix(in srgb, var(--negative) 18%, transparent);
			}
			#mic-btn.on svg.i,
			#mic-btn.on:hover svg.i {
				color: var(--negative);
			}
			#mic-btn.err svg.i {
				color: var(--negative);
			}

			#status {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0 24px;
				text-align: center;
				color: var(--text-weak);
				font: 520 14px/20px var(--font);
				letter-spacing: -0.1px;
				pointer-events: none;
			}
			#stats {
				position: fixed;
				top: 6px;
				left: 6px;
				padding: 6px 8px;
				background: rgba(0, 0, 0, 0.7);
				color: #b8f7c4;
				font:
					12px/1.35 ui-monospace,
					Menlo,
					monospace;
				white-space: pre;
				border-radius: 4px;
				pointer-events: none;
				display: none;
				z-index: 2;
			}

			/* Files panel: the app's dialog frame (secondary surface, 16px radius, 4px inset) around a raised body. */
			#files {
				position: fixed;
				top: 8px;
				right: 8px;
				bottom: 8px;
				width: min(360px, calc(100vw - 16px));
				z-index: 4;
				display: none;
				flex-direction: column;
				box-sizing: border-box;
				padding: 4px;
				background: var(--surface-secondary);
				border: 1px solid var(--border-default);
				border-radius: 16px;
				box-shadow: var(--shadow-lg);
				color: var(--text-default);
				font: 440 13px/16px var(--font);
				letter-spacing: -0.2px;
			}
			#files.open {
				display: flex;
				animation: enter 0.15s cubic-bezier(0.23, 1, 0.32, 1);
			}
			@keyframes enter {
				from {
					opacity: 0;
					transform: translateY(-4px) scale(0.98);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#files.open {
					animation: none;
				}
			}
			#files header {
				display: flex;
				align-items: center;
				gap: 4px;
				height: 32px;
				margin-top: -2px;
				padding: 6px 2px 6px 8px;
				box-sizing: border-box;
			}
			#files header h2 {
				flex: 1;
				margin: 0;
				font-size: 13px;
				line-height: 1;
				font-weight: 520;
				color: var(--text-default);
			}
			.btn {
				height: 24px;
				border: 0;
				border-radius: 8px;
				padding: 4px;
				display: inline-flex;
				align-items: center;
				gap: 2px;
				cursor: pointer;
				font-weight: 520;
				font-size: 13px;
				line-height: 16px;
				letter-spacing: -0.2px;
				white-space: nowrap;
				transition: background-color 0.1s;
			}
			.btn span {
				padding: 0 3px 0 1px;
			}
			.btn.primary {
				color: var(--text-title);
				background: var(--fill-primary);
				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.08) inset,
					0 -1px 2px 0 rgba(255, 255, 255, 0.12) inset,
					0 1px 2px 0 rgba(255, 255, 255, 0.16) inset;
			}
			.btn.primary svg.i {
				color: #fff;
			}
			.btn.primary:hover {
				background: var(--fill-primary-hover);
			}
			.btn.primary:active {
				background: var(--fill-primary-pressed);
			}
			.body {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				background: var(--surface-raised);
				border-radius: 12px;
				box-shadow: var(--shadow-white-border);
				overflow: hidden;
			}
			#files-crumbs {
				display: flex;
				align-items: center;
				flex-wrap: nowrap;
				gap: 0;
				padding: 6px 8px 2px;
				min-height: 28px;
				overflow: hidden;
			}
			#files-crumbs a {
				height: 28px;
				display: inline-flex;
				align-items: center;
				padding: 0 8px;
				border-radius: 8px;
				color: var(--text-weak);
				font-weight: 520;
				cursor: pointer;
				text-decoration: none;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				min-width: 0;
				flex-shrink: 1;
			}
			#files-crumbs a:hover {
				background: var(--state-hover);
			}
			#files-crumbs a:last-child {
				color: var(--text-default);
				flex-shrink: 0;
				max-width: 60%;
			}
			#files-crumbs svg.i {
				color: var(--text-muted);
				padding: 0;
				margin: 0 -2px;
			}
			#files-list {
				flex: 1;
				overflow-y: auto;
				padding: 2px 6px 6px;
				scrollbar-width: thin;
				scrollbar-color: #ffffff29 transparent;
			}
			.f-row {
				display: flex;
				align-items: center;
				gap: 6px;
				height: 32px;
				padding: 0 8px 0 4px;
				border-radius: 6px;
				cursor: pointer;
			}
			.f-row:hover {
				background: var(--state-hover);
			}
			.f-row:active {
				background: var(--state-pressed);
			}
			.f-row .f-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text-default);
				font-weight: 520;
			}
			.f-row:hover .f-name {
				color: var(--text-title);
			}
			.f-row .f-meta {
				color: var(--text-muted);
				font-weight: 440;
				white-space: nowrap;
				font-variant-numeric: tabular-nums;
			}
			.f-row:hover svg.i {
				color: var(--icon-strong);
			}
			/* Download a folder as a zip: shown in place of the date on hover. */
			.f-row .f-dl {
				display: none;
				margin: 0 -4px 0 0;
			}
			.f-row:hover .f-dl,
			.f-row .f-dl:focus-visible {
				display: inline-flex;
			}
			.f-row:hover .f-dl + .f-meta {
				display: none;
			}
			.f-empty {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 48px 16px;
			}
			.f-empty svg.i {
				width: 20px;
				height: 20px;
				color: var(--icon-default);
				margin-bottom: 10px;
			}
			.f-empty b {
				color: var(--text-strong);
				font-weight: 600;
			}
			.f-empty span {
				color: var(--text-weak);
				font-weight: 520;
				margin-top: 6px;
				max-width: 240px;
			}
			#files-uploads:empty {
				display: none;
			}
			#files-uploads {
				border-top: 1px solid var(--border-default);
				padding: 6px 6px;
				max-height: 40%;
				overflow-y: auto;
			}
			.f-up {
				padding: 6px 8px;
				border-radius: 6px;
			}
			.f-up-top {
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.f-up .f-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text-default);
				font-weight: 520;
			}
			.f-up .f-meta {
				color: var(--text-weak);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.f-up.err .f-meta {
				color: var(--negative);
			}
			.f-up.done .f-meta {
				color: var(--positive);
			}
			.f-bar {
				height: 4px;
				margin-top: 6px;
				background: var(--accent-subtle);
				border-radius: 999px;
				overflow: hidden;
			}
			.f-bar i {
				display: block;
				height: 100%;
				width: 0;
				background: var(--accent);
				border-radius: 999px;
				transition: width 0.15s;
			}
			.f-up.done .f-bar,
			.f-up.err .f-bar {
				display: none;
			}
			#files footer {
				padding: 8px 8px 4px;
				color: var(--text-weak);
			}

			/* Drop target: a dialog-style card over a scrim. */
			#drop {
				position: fixed;
				inset: 0;
				z-index: 5;
				display: none;
				align-items: center;
				justify-content: center;
				background: #00000033;
				pointer-events: none;
			}
			#drop.show {
				display: flex;
			}
			#drop .frame {
				padding: 4px;
				background: var(--surface-secondary);
				border: 1px solid var(--border-default);
				border-radius: 16px;
				box-shadow: var(--shadow-lg);
			}
			#drop .inner {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				padding: 24px 32px;
				background: var(--surface-raised);
				border-radius: 12px;
				box-shadow: var(--shadow-white-border);
				outline: 1.5px dashed #ffffff33;
				outline-offset: -8px;
				font: 520 13px/16px var(--font);
				letter-spacing: -0.2px;
				color: var(--text-weak);
			}
			#drop .inner svg.i {
				width: 20px;
				height: 20px;
				color: var(--icon-title);
				margin-bottom: 4px;
			}
			#drop .inner b {
				color: var(--text-strong);
				font-weight: 600;
				font-size: 14px;
				line-height: 20px;
				letter-spacing: -0.1px;
			}
		</style>
	</head>
	<body>
		<div id="surface" tabindex="0"><canvas id="screen"></canvas></div>
		<textarea
			id="kbd"
			autocomplete="off"
			autocorrect="off"
			autocapitalize="off"
			spellcheck="false"
			tabindex="-1"
			aria-hidden="true"></textarea>
		<div id="tools">
			<button
				id="kb-btn"
				class="ib"
				type="button"
				title="Keyboard"
				aria-label="Show keyboard">
				<svg class="i" viewBox="0 0 24 24" fill="none">
					<path
						d="M3 6H21V18H3Z"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M8 10H8.01M12 10H12.01M16 10H16.01"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M8 14H16"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>
			</button>
			<button
				id="mic-btn"
				class="ib"
				type="button"
				title="Turn microphone on"
				aria-label="Microphone"
				aria-pressed="false">
				<svg class="i on" viewBox="0 0 24 24" fill="none">
					<path
						d="M9 6C9 4.34 10.34 3 12 3C13.66 3 15 4.34 15 6V11C15 12.66 13.66 14 12 14C10.34 14 9 12.66 9 11Z"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M5 11C5 14.87 8.13 18 12 18C15.87 18 19 14.87 19 11"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M12 18V21"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" /></svg
				><svg class="i off" viewBox="0 0 24 24" fill="none">
					<path
						d="M9 6C9 4.34 10.34 3 12 3C13.66 3 15 4.34 15 6V11C15 12.66 13.66 14 12 14C10.34 14 9 12.66 9 11Z"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M5 11C5 14.87 8.13 18 12 18C15.87 18 19 14.87 19 11"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M12 18V21"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
					<path
						d="M4 4L20 20"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>
			</button>
			<button
				id="files-btn"
				class="ib"
				type="button"
				title="Files"
				aria-label="Files">
				<svg class="i" viewBox="0 0 24 24" fill="none">
					<path
						d="M3 4.5H9.5L11.5 7H21V19.5H3Z"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>
			</button>
			<button
				id="fs-btn"
				class="ib"
				type="button"
				title="Fullscreen (captures browser shortcuts)"
				aria-label="Toggle fullscreen">
				<svg class="i" viewBox="0 0 24 24" fill="none">
					<path
						d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>
			</button>
		</div>
		<div id="files" role="dialog" aria-label="Files">
			<header>
				<h2>Files</h2>
				<button
					id="files-upload"
					class="btn primary"
					type="button"
					title="Upload files to this folder">
					<svg class="i" viewBox="0 0 24 24" fill="none">
						<path
							d="M12 19V5"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round" />
						<path
							d="M6 11L12 5L18 11"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round" /></svg
					><span>Upload</span>
				</button>
				<button
					id="files-upload-dir"
					class="ib sm"
					type="button"
					title="Upload a folder to this folder"
					aria-label="Upload a folder">
					<svg class="i" viewBox="0 0 24 24" fill="none">
						<path
							d="M3 4.5H9.5L11.5 7H21V19.5H3Z"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round" />
						<path
							d="M12 17V11"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round" />
						<path
							d="M9.5 13.5L12 11L14.5 13.5"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
