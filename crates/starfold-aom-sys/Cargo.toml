[package]
name = "starfold-aom-sys"
version = "0.1.0+libaom.3.15.3"
edition = "2021"
# These bindings and build script are MIT; libaom, built from aom/ and linked statically, is
# BSD-2-Clause; the libaom source this crate ships also has third_party/ code under BSD-3-Clause
# (fastfeat, highway, libwebm, libyuv) and ISC (x86inc).
license = "MIT AND BSD-2-Clause AND BSD-3-Clause AND ISC"
description = "libaom's AV1 encoder, real-time only, built from source and linked statically, for starfold"
repository = "https://github.com/kyora-sh/starfold"
# crates.io only; see crates/starfold-server/Cargo.toml.
publish = ["crates-io"]
links = "aom"
categories = ["external-ffi-bindings", "multimedia::video"]
# libaom's test sources, docs and examples are not needed to build the library (its cmake
# files still read test/*.cmake, so those stay).
exclude = [
	"aom/test/*.cc",
	"aom/test/*.h",
	"aom/third_party/googletest/",
	"aom/doc/",
	"aom/examples/",
]

[build-dependencies]
bindgen = "0.72"
cc = "1"
cmake = "0.1.58"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
