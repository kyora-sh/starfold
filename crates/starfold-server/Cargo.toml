[package]
name = "starfold"
version = "0.4.0"
edition = "2021"
# starfold's own code is MIT; the web client it embeds carries dav1d.wasm (dav1d, BSD-2-Clause;
# wasi-libc, MIT) and the Inter font (OFL-1.1), with their licences in web/.
license = "MIT AND BSD-2-Clause AND OFL-1.1"
description = "Low-latency desktop streaming for the browser: an X11 display, a Mac's screen or a Windows desktop as AV1 or H.264 over a WebSocket"
repository = "https://github.com/kyora-sh/starfold"
readme = "../../README.md"
# crates.io only; .github/release/about.toml relies on it to leave starfold's own crates out of the
# release archives' list of Rust dependencies.
publish = ["crates-io"]
# web/ is the web client, staged from a repository build before packaging
# (.github/release/stage-crate-web.sh); the repository's own builds read packages/web.
include = ["/src/**", "/build.rs", "/web/**", "/LICENSE"]
# Lets programs that embed starfold read DEP_STARFOLD_RPATH (see build.rs).
links = "starfold"
keywords = ["remote-desktop", "streaming", "x11", "h264", "websocket"]
categories = ["command-line-utilities", "multimedia::video"]

# The server, as a library for programs that embed it.
[lib]
name = "starfold"
path = "src/lib.rs"

[[bin]]
name = "starfold"
path = "src/main.rs"

[features]
default = ["libaom"]
# libaom (BSD-2-Clause), the software AV1 encoder: built from the pinned source in
# crates/starfold-aom-sys/aom (a git submodule) and linked statically; needs cmake, perl and nasm.
libaom = ["dep:starfold-aom-sys"]
# libx264 (GPL-2.0-or-later), the software H.264 encoder for protocol 1 viewers and browsers
# without AV1: a build with it is GPL-2.0-or-later.
x264 = ["dep:bindgen"]
# Software encoders for the bench, picked with --encoder <arm>; native libraries from pkg-config.
sw-arm = ["dep:bindgen"]
libvpx = ["sw-arm"]
svt-av1 = ["sw-arm"]
kvazaar = ["sw-arm"]
# GPL-2.0, measurement only.
x265 = ["sw-arm"]

[dependencies]
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"sync",
	"time",
	"signal",
	"fs",
	"io-util",
] }
axum = { version = "0.8", features = ["ws"] }
# --base-path puts its checks in front of the router as one service (base_path.rs).
tower = { version = "0.5", default-features = false }
# axum's WebSocket errors, to tell a message refused for its size.
tungstenite = { version = "0.29", default-features = false }
libc = "0.2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
] }
png = "0.18"
base64 = "0.22"
getrandom = "0.3"
zip = { version = "7", default-features = false, features = [
	"deflate-flate2-zlib-rs",
] }
starfold-aom-sys = { path = "../starfold-aom-sys", version = "=0.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["dir", "fs", "poll", "time"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# libva and NVENC are opened at runtime, so hosts without them start as usual.
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = [
	"shm",
	"damage",
	"xfixes",
	"xtest",
	"shape",
	"xinput",
	"randr",
	"allow-unsafe-code",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_Media_Audio",
	"Win32_Media_MediaFoundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_DataExchange",
	"Win32_System_JobObjects",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_Pipes",
	"Win32_System_StationsAndDesktops",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = [
	"handshake",
] }

[build-dependencies]
bindgen = { version = "0.72", optional = true }
pkg-config = "0.3"
vcpkg = "0.2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
