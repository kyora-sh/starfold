<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>novnc</title>
		<style>
			html, body, #screen { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
		</style>
	</head>
	<body>
		<div id="screen"></div>
		<script type="module">
			import RFB from './core/rfb.js';
			const q = new URLSearchParams(location.search);
			const rfb = new RFB(document.getElementById('screen'), `ws://${location.host}/websockify`, { shared: true });
			rfb.scaleViewport = true;
			rfb.qualityLevel = Number(q.get('quality'));
			rfb.compressionLevel = Number(q.get('compression'));
			rfb.addEventListener('connect', () => (window.novncConnected = true));
			rfb.addEventListener('disconnect', () => (window.novncDisconnected = true));
			window.rfb = rfb;
		</script>
	</body>
</html>
