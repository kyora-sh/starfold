name: Release

# Builds the release binaries, the Python SDK and the embeddable web client, and on a version tag
# (v0.4.0, ...) attaches them to a GitHub release with GitHub's generated notes (the pull requests
# merged since the previous tag). After the release exists, the same tag publishes the default
# (MIT) build's packages to the registries: the crates to crates.io; the embeddable web client,
# the TypeScript SDK and the four server-binary packages to npm; the Python SDK's sdist, pure wheel
# and platform wheels to PyPI; each through trusted publishing (a short-lived token from GitHub's
# OIDC identity). The one exception is crates.io's first release, which the `crates` environment's
# secret CRATES_IO_BOOTSTRAP_TOKEN publishes until it is deleted (RELEASING.md). Those jobs run on GitHub-hosted runners, which
# npm requires for trusted publishing; RELEASING.md has the one-time registry setup. The x264
# flavour is never published to a registry.
#
# Each binary comes in exactly two flavours: starfold-<version>-<platform> links libaom
# (BSD-2-Clause, with the Alliance for Open Media Patent License 1.0) and is distributed under MIT;
# starfold-x264-<version>-<platform> links libaom and x264 and is GPL-2.0-or-later as a combined
# work. THIRD_PARTY.md, in every archive, lists the licences each flavour's binary carries. The
# release also attaches the exact x264 source of every platform's build, from third_party/x264
# (hash-checked, nothing fetched).
#
# A dry run builds and checks everything and uploads the files as workflow artifacts only, and
# runs each registry job's dry run (cargo package and publish --dry-run, npm publish --dry-run,
# twine check): a push to a branch other than main that changes this workflow or the scripts it
# runs, or a manual run.
# There is no pull_request trigger: forks can't reach these self-hosted runners, because only
# writers can push branches here and a fork's push runs in the fork. Only a pushed v* tag creates
# the release and publishes; the release job's condition can't be met by a branch push or a manual
# run, and the registry jobs publish only after it succeeded on a tag.
# Bump `version` in crates/starfold-server/Cargo.toml, python/starfold/pyproject.toml and
# packages/starfold/package.json (and bun.lock, RELEASING.md) on main first; the tag has to match
# all three.
on:
  push:
    tags: ['v*']
    branches-ignore: [main]
    # Branch pushes only (paths don't filter tag pushes): this workflow and what it executes.
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - packages/web/embed/pack.sh
      - packages/starfold/**
      - crates/*/Cargo.toml
      - python/starfold/pyproject.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything and upload it as workflow artifacts; a manual run never releases
        type: choice
        options: ['true']
        default: 'true'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  RUST_TOOLCHAIN: '1.93.0'
  LIBX264_DEB: 'libx264-dev=2:0.164.3108+git31e19f9-1'
  BREW_X264: 'x264 r3222'
  CARGO_ABOUT: '0.9.3'
  # Symbols stay for backtraces; the line tables of `debug = 1` don't ship.
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  # 1 builds, checks, attaches and publishes the Linux platform wheels; 0 leaves them out everywhere
  # (python-platform-wheels.sh and expected-files.sh read it), and pip on Linux takes the pure wheel.
  LINUX_WHEELS: '1'

jobs:
  # Resolves what every later job builds, once: on a tag, the commit the tag names on the remote
  # (which must be the commit this run was started for); otherwise the commit pushed or dispatched.
  version:
    name: Version
    runs-on: kyora-2x4
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      flavours: ${{ steps.flavours.outputs.flavours }}
      flavour_names: ${{ steps.flavours.outputs.names }}
    steps:
      # The binary flavours every platform builds, one line each: deleting a line drops that flavour
      # everywhere, and from the files the release expects. x264 decides the archive's x264 extras
      # (COPYING, the x264 source check, its runtime package).
      - id: flavours
        run: |
          flavours=(
            '{"name": "starfold-x264", "licence": "GPL-2.0-or-later", "features": "--features x264", "x264": true}'
            '{"name": "starfold", "licence": "MIT", "features": "", "x264": false}'
          )
          echo "flavours=[$(IFS=,; echo "${flavours[*]}")]" >> "$GITHUB_OUTPUT"
          echo "names=$(printf '%s\n' "${flavours[@]}" | sed -n 's/.*"name": "\([^"]*\)".*/\1/p' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: commit
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            commit=$(.github/release/tag-commit.sh "$GITHUB_REF_NAME")
            [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME names $commit on the remote, but this run was started for $GITHUB_SHA"; exit 1; }
          else
            commit=$GITHUB_SHA
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "building $commit ($GITHUB_REF)"
      # Cargo.toml's version, which pyproject.toml and packages/starfold/package.json must declare
      # too; on a tag, the tag has to name it.
      - id: version
        run: |
          version=$(python3 -I .github/release/versions.py cargo crates/starfold-server/Cargo.toml)
          python3 -I .github/release/versions.py check pyproject python/starfold/pyproject.toml "$version" ||
            { echo "::error::python/starfold/pyproject.toml doesn't declare $version, crates/starfold-server/Cargo.toml's version"; exit 1; }
          python3 -I .github/release/versions.py check package-json-file packages/starfold/package.json "$version" ||
            { echo "::error::packages/starfold/package.json doesn't declare $version, crates/starfold-server/Cargo.toml's version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in crates/starfold-server/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version $version"

  linux:
    name: Linux x86_64 (${{ matrix.flavour.licence }})
    needs: version
    runs-on: kyora-8x16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.version.outputs.flavours) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_FLAVOURS: ${{ needs.version.outputs.flavour_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - name: Archive name
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          .github/release/no-x264-override.sh
          echo "ARCHIVE=$(.github/release/expected-files.sh archive "$VERSION" '${{ matrix.flavour.name }}' x86_64-linux | sed 's/\.tar\.gz$//')" >> "$GITHUB_ENV"
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev cmake nasm perl esbuild; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.flavour.name }}-linux-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.flavour.name }}-linux-${{ env.RUST_TOOLCHAIN }}-
      - id: cargo-about
        uses: actions/cache@v4
        with:
          path: ~/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT }}-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}
      - name: cargo-about
        run: |
          if [ "${{ steps.cargo-about.outputs.cache-hit }}" != true ]; then
            cargo install --locked --root ~/cargo-about cargo-about --version "$CARGO_ABOUT" --features cli
          fi
          ~/cargo-about/bin/cargo-about --version
          echo "$HOME/cargo-about/bin" >> "$GITHUB_PATH"
      - name: x264's source is the one built against
        if: matrix.flavour.x264
        run: .github/release/x264-source.sh linux amd64
      - name: Build
        run: cargo build --release --locked --manifest-path crates/starfold-server/Cargo.toml ${{ matrix.flavour.features }}
      # build.rs embeds the library dirs pkg-config reports as an rpath; a released binary may only
      # carry /lib, /usr/lib and their multiarch directories, and no empty entry.
      - name: Library paths
        run: |
          .github/release/check-rpath.sh readelf target/release/starfold x86_64-linux-gnu
          ldd target/release/starfold
      - name: Version and licence
        run: .github/release/check-version.sh "$VERSION" '${{ matrix.flavour.licence }}' target/release/starfold
      - name: Licences
        run: |
          mkdir -p "$RUNNER_TEMP/licenses/rust-std"
          # Rust's standard library, linked into every binary: its notices from the toolchain built with.
          doc=$(rustc --print sysroot)/share/doc/rust
          cp "$doc/COPYRIGHT-library.html" "$doc"/licenses/* "$RUNNER_TEMP/licenses/rust-std/"
          .github/release/linux-runtime-notices.sh cc "$RUNNER_TEMP/licenses"
          .github/release/about-private.sh --filter-platform x86_64-unknown-linux-gnu ${{ matrix.flavour.features }}
          cargo about generate --locked --fail -c .github/release/about.toml --target x86_64-unknown-linux-gnu \
            ${{ matrix.flavour.features }} -o "$RUNNER_TEMP/licenses/rust-crates.txt" .github/release/about.hbs
          ls -l "$RUNNER_TEMP/licenses"
      - name: Package
        run: .github/release/package.sh "$VERSION" "$ARCHIVE" target/release/starfold tar.gz dist "$RUNNER_TEMP"/licenses/*
      # The archive on a clean Ubuntu 24.04 with only the runtime packages the README names. The
      # container shares the runner's network: on docker's bridge, large package downloads stall.
      # It gets the runner's apt proxy settings, if any, for apt-install.sh's first attempt: a
      # file only this user can read, removed when the step ends.
      - name: Clean Ubuntu 24.04
        timeout-minutes: 25
        run: |
          proxy=$(mktemp -p "$RUNNER_TEMP" apt-proxy.XXXXXX)
          trap 'rm -f "$proxy"' EXIT
          apt-config dump 2>/dev/null | grep -i -E '^Acquire::https?::Proxy(::[^ ]+)? "[^"]+";$' >"$proxy" || true
          docker run --rm --network host -v "$PWD:/src:ro" -w /src -v "$proxy:/run/runner-apt-proxy.conf:ro" ubuntu:24.04 \
            .github/release/smoke-linux.sh "dist/$ARCHIVE.tar.gz" "$VERSION" '${{ matrix.flavour.licence }}' \
            libyuv0 libopus0 libpulse0 ${{ matrix.flavour.x264 && 'libx264-164' || '' }}
      - run: tar -tzvf "dist/$ARCHIVE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  linux-arm64:
    name: Linux aarch64 (${{ matrix.flavour.licence }}, cross-compiled)
    needs: version
    runs-on: kyora-8x16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.version.outputs.flavours) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_FLAVOURS: ${{ needs.version.outputs.flavour_names }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      PKG_CONFIG_ALLOW_CROSS: '1'
      PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - name: Archive name
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          .github/release/no-x264-override.sh
          echo "ARCHIVE=$(.github/release/expected-files.sh archive "$VERSION" '${{ matrix.flavour.name }}' aarch64-linux | sed 's/\.tar\.gz$//')" >> "$GITHUB_ENV"
      # Ubuntu's arm64 packages (ports.ubuntu.com) beside the amd64 ones, the aarch64 GCC, and
      # qemu to run the binary's --version. A library both architectures install, such as
      # libsystemd0, must be the same version in both, so the runner's amd64 copy is brought up
      # to the archive's in the same install: a runner whose copy is older than the archive's
      # could otherwise not take the arm64 one.
      - name: Native libraries (arm64)
        run: |
          src=/etc/apt/sources.list.d/ubuntu.sources
          cat "$src"
          sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' "$src"
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<'SRC'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo dpkg --add-architecture arm64
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && apt-cache policy libsystemd0 libsystemd0:arm64 && aptq 720 install -y libsystemd0 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libclang-dev cmake perl esbuild qemu-user-static "${LIBX264_DEB/libx264-dev/libx264-dev:arm64}" libyuv-dev:arm64 libopus-dev:arm64 libpulse-dev:arm64 libxcb1-dev:arm64; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.flavour.name }}-linux-arm64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.flavour.name }}-linux-arm64-${{ env.RUST_TOOLCHAIN }}-
      - id: cargo-about
        uses: actions/cache@v4
        with:
          path: ~/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT }}-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}
      - name: cargo-about
        run: |
          if [ "${{ steps.cargo-about.outputs.cache-hit }}" != true ]; then
            cargo install --locked --root ~/cargo-about cargo-about --version "$CARGO_ABOUT" --features cli
          fi
          ~/cargo-about/bin/cargo-about --version
          echo "$HOME/cargo-about/bin" >> "$GITHUB_PATH"
      - name: x264's source is the one built against
        if: matrix.flavour.x264
        run: .github/release/x264-source.sh linux arm64
      - name: Build
        run: cargo build --release --locked --manifest-path crates/starfold-server/Cargo.toml --target aarch64-unknown-linux-gnu ${{ matrix.flavour.features }}
      - name: Library paths
        run: .github/release/check-rpath.sh aarch64-linux-gnu-readelf target/aarch64-unknown-linux-gnu/release/starfold aarch64-linux-gnu
      - name: Version and licence (qemu)
        env:
          QEMU_LD_PREFIX: /
        run: .github/release/check-version.sh "$VERSION" '${{ matrix.flavour.licence }}' qemu-aarch64-static target/aarch64-unknown-linux-gnu/release/starfold
      - name: Licences
        run: |
          mkdir -p "$RUNNER_TEMP/licenses/rust-std"
          # Rust's standard library, linked into every binary: its notices from the toolchain built with.
          doc=$(rustc --print sysroot)/share/doc/rust
          cp "$doc/COPYRIGHT-library.html" "$doc"/licenses/* "$RUNNER_TEMP/licenses/rust-std/"
          .github/release/linux-runtime-notices.sh aarch64-linux-gnu-gcc "$RUNNER_TEMP/licenses"
          .github/release/about-private.sh --filter-platform aarch64-unknown-linux-gnu ${{ matrix.flavour.features }}
          cargo about generate --locked --fail -c .github/release/about.toml --target aarch64-unknown-linux-gnu \
            ${{ matrix.flavour.features }} -o "$RUNNER_TEMP/licenses/rust-crates.txt" .github/release/about.hbs
          ls -l "$RUNNER_TEMP/licenses"
      - name: Package
        run: .github/release/package.sh "$VERSION" "$ARCHIVE" target/aarch64-unknown-linux-gnu/release/starfold tar.gz dist "$RUNNER_TEMP"/licenses/*
      - run: tar -tzvf "dist/$ARCHIVE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  macos:
    name: macOS arm64 (${{ matrix.flavour.licence }})
    needs: version
    runs-on: kyora-macos
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.version.outputs.flavours) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_FLAVOURS: ${{ needs.version.outputs.flavour_names }}
      # Homebrew's static Opus and x264, so the binary needs nothing from Homebrew at run time.
      OPUS_STATIC: '1'
      X264_STATIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - name: Archive name
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          echo "ARCHIVE=$(.github/release/expected-files.sh archive "$VERSION" '${{ matrix.flavour.name }}' aarch64-macos | sed 's/\.tar\.gz$//')" >> "$GITHUB_ENV"
      - run: uname -m && sw_vers
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The runner image may not have Homebrew yet.
      - name: Homebrew
        run: |
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          brew=$(command -v brew || echo /opt/homebrew/bin/brew)
          prefix=$("$brew" --prefix)
          {
            echo "HOMEBREW_PREFIX=$prefix"
            echo "HOMEBREW_CELLAR=$prefix/Cellar"
            echo "HOMEBREW_REPOSITORY=$("$brew" --repository)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      # pkg-config sees only the .pc files of Homebrew's Opus (and x264): the build links the
      # libraries of those kegs and no other.
      - run: |
          brew install opus pkgconf esbuild cmake nasm ${{ matrix.flavour.x264 && 'x264' || '' }}
          libdir=$(brew --prefix opus)/lib/pkgconfig
          if [ '${{ matrix.flavour.x264 }}' = true ]; then
            [ "$(brew list --versions x264)" = "$BREW_X264" ] || { echo "::error::Homebrew has $(brew list --versions x264), pinned $BREW_X264"; exit 1; }
            libdir=$libdir:$(brew --prefix x264)/lib/pkgconfig
          fi
          brew list --versions opus
          echo "PKG_CONFIG_LIBDIR=$libdir" >> "$GITHUB_ENV"
      # The x264 build links Homebrew's keg archive by its path (build.rs's STARFOLD_X264_LIB), the
      # archive whose formula and source are checked here; the build then reports what it linked.
      - name: x264's source is the one built against
        if: matrix.flavour.x264
        run: |
          lib=$(cd "$(brew --prefix x264)/lib" && pwd -P)/libx264.a
          .github/release/x264-source.sh macos "$lib"
          shasum -a 256 "$lib"
          echo "STARFOLD_X264_LIB=$lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.flavour.name }}-macos-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.flavour.name }}-macos-${{ env.RUST_TOOLCHAIN }}-
      - id: cargo-about
        uses: actions/cache@v4
        with:
          path: ~/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT }}-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}
      - name: cargo-about
        run: |
          if [ "${{ steps.cargo-about.outputs.cache-hit }}" != true ]; then
            cargo install --locked --root ~/cargo-about cargo-about --version "$CARGO_ABOUT" --features cli
          fi
          ~/cargo-about/bin/cargo-about --version
          echo "$HOME/cargo-about/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cargo build --release --locked --manifest-path crates/starfold-server/Cargo.toml ${{ matrix.flavour.features }} \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.json"
          if [ '${{ matrix.flavour.x264 }}' = true ]; then
            .github/release/x264-linked.sh "$RUNNER_TEMP/build.json" "$STARFOLD_X264_LIB"
          fi
      # Only the system's libraries and frameworks, nothing from Homebrew. build.rs's rpath to
      # Homebrew's Opus is unused with Opus linked in, so it is dropped (and the binary re-signed).
      - name: Library paths
        run: |
          bin=target/release/starfold
          otool -l "$bin" | grep -A4 LC_BUILD_VERSION
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -v -E '^[[:space:]]+/(usr/lib|System/Library)/'; then
            echo "::error::the binary links a library outside the system's"
            exit 1
          fi
          for p in $(otool -l "$bin" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }'); do
            install_name_tool -delete_rpath "$p" "$bin"
          done
          codesign --force --sign - "$bin"
          if otool -l "$bin" | grep -q LC_RPATH; then
            echo "::error::an rpath is left in the binary"
            exit 1
          fi
      - name: Version and licence
        run: .github/release/check-version.sh "$VERSION" '${{ matrix.flavour.licence }}' target/release/starfold
      - name: Licences
        run: |
          mkdir -p "$RUNNER_TEMP/licenses/rust-std"
          # Rust's standard library, linked into every binary: its notices from the toolchain built with.
          doc=$(rustc --print sysroot)/share/doc/rust
          cp "$doc/COPYRIGHT-library.html" "$doc"/licenses/* "$RUNNER_TEMP/licenses/rust-std/"
          .github/release/about-private.sh --filter-platform aarch64-apple-darwin ${{ matrix.flavour.features }}
          cargo about generate --locked --fail -c .github/release/about.toml --target aarch64-apple-darwin \
            ${{ matrix.flavour.features }} -o "$RUNNER_TEMP/licenses/rust-crates.txt" .github/release/about.hbs
          cp "$(brew --prefix opus)/COPYING" "$RUNNER_TEMP/licenses/Opus-COPYING.txt"
          ls -l "$RUNNER_TEMP/licenses"
      - name: Package
        run: .github/release/package.sh "$VERSION" "$ARCHIVE" target/release/starfold tar.gz dist "$RUNNER_TEMP"/licenses/*
      - run: tar -tzvf "dist/$ARCHIVE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Windows x86_64 (${{ matrix.flavour.licence }}, cross-compiled)
    needs: version
    runs-on: kyora-8x16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.version.outputs.flavours) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_FLAVOURS: ${{ needs.version.outputs.flavour_names }}
      VCPKG_BASELINE: 2026.10.16
      # The commit tag 2026.10.16 names, so a moved tag can't change the ports built.
      VCPKG_COMMIT: 9eec002df1cd109f8f104cd966a763daf9751489
      # GCC's runtime licence comes from this package; another version fails the job.
      GCC_MINGW_BASE: 13.2.0-6ubuntu1+26.1
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKGRS_TRIPLET: x64-mingw-static
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - name: Archive name
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          .github/release/no-x264-override.sh
          echo "ARCHIVE=$(.github/release/expected-files.sh archive "$VERSION" '${{ matrix.flavour.name }}' x86_64-windows | sed 's/\.zip$//')" >> "$GITHUB_ENV"
      - name: MinGW, NASM and vcpkg's build tools
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y mingw-w64 nasm cmake ninja-build perl pkg-config libclang-dev esbuild zip unzip; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-mingw-static-${{ env.VCPKG_BASELINE }}-x264-libyuv-opus-v1
      - uses: actions/cache@v4
        with:
          path: .vcpkg-downloads
          key: vcpkg-downloads-${{ env.VCPKG_BASELINE }}-v1
      - name: x264, libyuv and Opus (vcpkg)
        run: |
          mkdir -p .vcpkg-cache .vcpkg-downloads
          retry() { for i in 1 2 3; do "$@" && return; [ "$i" = 3 ] || sleep $((i * 30)); done; return 1; }
          git init --quiet "$VCPKG_ROOT"
          retry git -C "$VCPKG_ROOT" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --quiet --detach FETCH_HEAD
          [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT" ] || { echo "::error::vcpkg isn't at $VCPKG_COMMIT"; exit 1; }
          retry "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          retry "$VCPKG_ROOT/vcpkg" install x264 libyuv opus --triplet "$VCPKGRS_TRIPLET"
      - name: x264's source is the one built against
        if: matrix.flavour.x264
        run: .github/release/x264-source.sh windows "$VCPKG_ROOT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.flavour.name }}-windows-gnu-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.flavour.name }}-windows-gnu-${{ env.RUST_TOOLCHAIN }}-
      - id: cargo-about
        uses: actions/cache@v4
        with:
          path: ~/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT }}-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}
      - name: cargo-about
        run: |
          if [ "${{ steps.cargo-about.outputs.cache-hit }}" != true ]; then
            cargo install --locked --root ~/cargo-about cargo-about --version "$CARGO_ABOUT" --features cli
          fi
          ~/cargo-about/bin/cargo-about --version
          echo "$HOME/cargo-about/bin" >> "$GITHUB_PATH"
      # The MinGW C and C++ runtimes linked in, so starfold.exe needs only Windows' own DLLs. A
      # directory holding only libstdc++.a, searched first, makes any -lstdc++ the static archive.
      - name: Build
        run: |
          static=$RUNNER_TEMP/static-libstdcxx
          mkdir -p "$static"
          ln -sf "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++.a)" "$static/libstdc++.a"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C target-feature=+crt-static -L native=$static"
          cargo build --release --locked --manifest-path crates/starfold-server/Cargo.toml --target x86_64-pc-windows-gnu ${{ matrix.flavour.features }}
      # Windows' own DLLs only: no MinGW runtime beside the .exe.
      - name: DLLs
        run: |
          exe=target/x86_64-pc-windows-gnu/release/starfold.exe
          x86_64-w64-mingw32-objdump -p "$exe" | grep 'DLL Name'
          if x86_64-w64-mingw32-objdump -p "$exe" | grep 'DLL Name' | grep -i -E 'libstdc|libgcc|libwinpthread|mingw|opus|yuv|x264'; then
            echo "::error::starfold.exe needs a DLL that isn't Windows' own"
            exit 1
          fi
      # Wine aborts on the runner itself, so it runs in a clean Ubuntu 24.04 container (on the
      # runner's network and with its apt proxy settings, as above).
      - name: Version and licence (Wine)
        timeout-minutes: 25
        run: |
          proxy=$(mktemp -p "$RUNNER_TEMP" apt-proxy.XXXXXX)
          trap 'rm -f "$proxy"' EXIT
          apt-config dump 2>/dev/null | grep -i -E '^Acquire::https?::Proxy(::[^ ]+)? "[^"]+";$' >"$proxy" || true
          docker run --rm --network host -v "$PWD:/src:ro" -w /src -v "$proxy:/run/runner-apt-proxy.conf:ro" -e WINEDEBUG=-all -e 'WINEDLLOVERRIDES=mscoree,mshtml=' ubuntu:24.04 bash -c '
            set -e
            .github/release/apt-install.sh wine64
            .github/release/check-version.sh "$1" "$2" /usr/lib/wine/wine64 target/x86_64-pc-windows-gnu/release/starfold.exe
          ' _ "$VERSION" '${{ matrix.flavour.licence }}'
      - name: Licences
        run: |
          mkdir -p "$RUNNER_TEMP/licenses/rust-std"
          # Rust's standard library, linked into every binary: its notices from the toolchain built with.
          doc=$(rustc --print sysroot)/share/doc/rust
          cp "$doc/COPYRIGHT-library.html" "$doc"/licenses/* "$RUNNER_TEMP/licenses/rust-std/"
          .github/release/about-private.sh --filter-platform x86_64-pc-windows-gnu ${{ matrix.flavour.features }}
          cargo about generate --locked --fail -c .github/release/about.toml --target x86_64-pc-windows-gnu \
            ${{ matrix.flavour.features }} -o "$RUNNER_TEMP/licenses/rust-crates.txt" .github/release/about.hbs
          share=$VCPKG_ROOT/installed/$VCPKGRS_TRIPLET/share
          cp "$share/opus/copyright" "$RUNNER_TEMP/licenses/Opus-COPYING.txt"
          cp "$share/libyuv/copyright" "$RUNNER_TEMP/licenses/libyuv-LICENSE.txt"
          # The MinGW-w64 runtime (including winpthreads, should it be linked) and GCC's runtime
          # libraries (libstdc++, libgcc), linked in statically: GPL-3.0-or-later with the GCC Runtime
          # Library Exception, whose text is in gcc-mingw-w64-base's copyright file.
          got=$(dpkg-query -W -f '${Version}' gcc-mingw-w64-base)
          [ "$got" = "$GCC_MINGW_BASE" ] || { echo "::error::gcc-mingw-w64-base is $got, pinned $GCC_MINGW_BASE"; exit 1; }
          grep -q 'GCC RUNTIME LIBRARY EXCEPTION' /usr/share/doc/gcc-mingw-w64-base/copyright
          grep -q 'Version 3, 29 June 2007' /usr/share/common-licenses/GPL-3
          cp /usr/share/doc/mingw-w64-common/copyright "$RUNNER_TEMP/licenses/MinGW-w64-copyright.txt"
          cp /usr/share/doc/gcc-mingw-w64-base/copyright "$RUNNER_TEMP/licenses/GCC-runtime-copyright.txt"
          cp /usr/share/common-licenses/GPL-3 "$RUNNER_TEMP/licenses/GPL-3.0.txt"
          echo "winpthreads symbols in starfold.exe: $(x86_64-w64-mingw32-nm target/x86_64-pc-windows-gnu/release/starfold.exe 2>/dev/null | grep -c -E ' (pthread_|_pthread)' || true)"
          ls -l "$RUNNER_TEMP/licenses"
      - name: Package
        run: .github/release/package.sh "$VERSION" "$ARCHIVE" target/x86_64-pc-windows-gnu/release/starfold.exe zip dist "$RUNNER_TEMP"/licenses/*
      - run: unzip -l "dist/$ARCHIVE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  python:
    name: Python SDK (sdist, wheel)
    needs: version
    runs-on: kyora-2x4
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: python/starfold
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      # pyproject.toml declares the version (the Version job checked it against Cargo.toml and the
      # tag); it is checked again here, never rewritten.
      - name: Build
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          python3 -I ../../.github/release/versions.py check pyproject pyproject.toml "$VERSION" ||
            { echo "::error::pyproject.toml doesn't declare $VERSION"; exit 1; }
          cmp LICENSE ../../LICENSE || { echo "::error::python/starfold/LICENSE isn't the repository's LICENSE"; exit 1; }
          uv build --out-dir "$GITHUB_WORKSPACE/dist"
      # The version and the MIT licence text, the repository's LICENSE, inside both distributions.
      - name: Check the version and the licence
        working-directory: dist
        run: |
          ls -l
          wheel=starfold-$VERSION-py3-none-any.whl sdist=starfold-$VERSION.tar.gz
          python3 -I ../.github/release/versions.py check wheel "$wheel" "$VERSION"
          python3 -I ../.github/release/versions.py check sdist "$sdist" "$VERSION"
          python3 -I ../.github/release/python-licence.py "$wheel" "$sdist" "starfold-$VERSION" ../LICENSE
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          unzip -l "starfold-$VERSION-py3-none-any.whl"
          tar -tzf "starfold-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: starfold-python-${{ env.VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  embed:
    name: Embeddable web client (npm tarball)
    needs: version
    runs-on: kyora-8x16
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The embeddable client declares no version of its own: pack.sh writes the release's into the
      # tarball's package.json, which the release checks against the tag.
      - name: Pack
        env:
          SHA: ${{ needs.version.outputs.commit }}
          PACK_VERSION: ${{ env.VERSION }}
        run: |
          echo "building $SHA"
          sudo timeout -k 10 300 env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 update
          sudo timeout -k 10 300 env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 install -y esbuild
          mkdir -p dist
          bash packages/web/embed/pack.sh "$SHA" dist
      - name: Check the version
        working-directory: dist
        run: |
          f=starfold-web-embed-$VERSION.tgz
          python3 -I ../.github/release/versions.py check package-json "$f" "$VERSION"
          sha256sum "$f" > "$f.sha256"
          tar -tzvf "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: starfold-web-embed-${{ env.VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # The SDKs with the server binary, from the default (MIT) build's four archives: the
  # @starfold/server-* npm packages and the starfold SDK pinned to them, and the Python SDK's
  # platform wheels (the pure wheel plus one platform's binary each). Built once, here; the install
  # jobs, the release and the registries take exactly these files.
  native:
    name: SDK packages with the server (npm, wheels)
    needs: [version, linux, linux-arm64, macos, windows, python]
    runs-on: kyora-8x16
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      - run: bun install --frozen-lockfile
      # The default flavour's archives only (starfold-<version>-<target>, never starfold-x264-*).
      - uses: actions/download-artifact@v4
        with:
          pattern: starfold-${{ env.VERSION }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: starfold-python-${{ env.VERSION }}
          path: artifacts/starfold-python-${{ env.VERSION }}
      - name: npm packages
        run: |
          set -o pipefail
          echo "building ${{ needs.version.outputs.commit }}"
          bash .github/release/npm-server-packages.sh "$VERSION" artifacts "$RUNNER_TEMP/npm" 2>&1 | tee "$RUNNER_TEMP/npm.log"
      - name: Platform wheels
        run: |
          set -o pipefail
          echo "LINUX_WHEELS=$LINUX_WHEELS"
          bash .github/release/python-platform-wheels.sh "$VERSION" artifacts \
            "artifacts/starfold-python-$VERSION/starfold-$VERSION-py3-none-any.whl" "$RUNNER_TEMP/wheels" 2>&1 | tee "$RUNNER_TEMP/wheels.log"
      - name: Sizes and auditwheel
        run: |
          {
            echo "### npm packages"
            echo '```'
            (cd "$RUNNER_TEMP/npm" && wc -c -- *.tgz)
            echo '```'
            echo "### Platform wheels (LINUX_WHEELS=$LINUX_WHEELS)"
            echo '```'
            (cd "$RUNNER_TEMP/wheels" && wc -c -- *.whl)
            echo '```'
            echo "### python-platform-wheels.sh, with auditwheel show for the Linux wheels"
            echo '```'
            cat "$RUNNER_TEMP/wheels.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: starfold-npm-${{ env.VERSION }}
          path: ${{ runner.temp }}/npm/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: starfold-wheels-${{ env.VERSION }}
          path: ${{ runner.temp }}/wheels/
          retention-days: 30
          if-no-files-found: error

  # Each platform installs exactly those files on that platform: the SDK with its server package
  # from npm's tarballs, and the platform wheel with pip; both `starfold --version` must name the
  # release. On Linux a server is started on Xvfb from each and takes a screenshot. The macOS and
  # Windows runners start none (no display a server could stream without a signed-in desktop).
  # GitHub-hosted runners (Linux arm64, Windows) cost nothing on a public repository.
  install:
    name: Install (${{ matrix.platform }})
    needs: [version, python, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: kyora-8x16
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: kyora-macos
          - platform: win32-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starfold-npm-${{ env.VERSION }}
          path: npm
      - uses: actions/download-artifact@v4
        with:
          name: starfold-wheels-${{ env.VERSION }}
          path: wheels
      # The pure wheel, which pip on Linux takes when LINUX_WHEELS is 0.
      - uses: actions/download-artifact@v4
        with:
          name: starfold-python-${{ env.VERSION }}
          path: python
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      # The guard both SDKs run the server under, on this system's /bin/sh (dash on Linux, bash
      # 3.2 in sh mode on macOS) with stand-in servers; Windows runs the server without one.
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          ref: ${{ needs.version.outputs.commit }}
          path: src
          sparse-checkout: |
            .github/release/guard-test.sh
            python/starfold/src/starfold/_native.py
          sparse-checkout-cone-mode: false
      - name: The server guard under /bin/sh
        if: runner.os != 'Windows'
        run: sh src/.github/release/guard-test.sh
      - name: Runtime libraries
        if: runner.os == 'Linux'
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          aptq 180 update
          aptq 300 install -y libyuv0 libopus0 libpulse0 xvfb
      - name: Checksums
        run: |
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd npm && sum -c -- *.sha256)
          (cd wheels && sum -c -- *.sha256)
      - name: npm install, starfold --version
        run: |
          set -euo pipefail
          mkdir app
          cd app
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../npm/starfold-$VERSION.tgz" "../npm/starfold-server-$PLATFORM-$VERSION.tgz"
          out=$(npx --no-install starfold --version)
          echo "$out"
          case $out in "starfold $VERSION"|"starfold $VERSION "*) ;; *) echo "::error::npx starfold --version printed '$out', not starfold $VERSION"; exit 1 ;; esac
      - name: pip install, starfold --version
        run: |
          set -euo pipefail
          uv venv --python 3.12 venv
          # Without Linux wheels (LINUX_WHEELS=0) pip on Linux takes the pure wheel: the client,
          # no binary to check.
          if [ "$RUNNER_OS" = Linux ] && [ "$LINUX_WHEELS" = 0 ]; then
            pure=python/starfold-$VERSION-py3-none-any.whl
            uv pip install --python venv --no-index --no-deps "$pure"
            uv pip install --python venv "$pure"
            echo "LINUX_WHEELS=0: no Linux platform wheel; the pure wheel installed, binary check skipped"
            exit 0
          fi
          # starfold from these wheels alone, pip's tag choice for this platform; then its
          # dependencies (httpx) from PyPI.
          uv pip install --python venv --no-index --no-deps --find-links wheels "starfold==$VERSION"
          uv pip install --python venv --find-links wheels "starfold==$VERSION"
          case $RUNNER_OS in Windows) bin=venv/Scripts/starfold.exe ;; *) bin=venv/bin/starfold ;; esac
          out=$("$bin" --version)
          echo "$out"
          case $out in "starfold $VERSION"|"starfold $VERSION "*) ;; *) echo "::error::starfold --version printed '$out', not starfold $VERSION"; exit 1 ;; esac
          uv pip list --python venv
      - name: Start a server and take a screenshot
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Xvfb names the display it picked once it takes connections.
          Xvfb -displayfd 3 -screen 0 1280x800x24 -nolisten tcp 3>"$RUNNER_TEMP/display" >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb=$!
          trap 'kill "$xvfb"' EXIT
          for _ in $(seq 60); do grep -q . "$RUNNER_TEMP/display" 2>/dev/null && break; sleep 0.25; done
          DISPLAY=:$(tr -d '\n' <"$RUNNER_TEMP/display")
          export DISPLAY
          echo "DISPLAY=$DISPLAY"
          cat > app/smoke.mjs <<'EOF'
          import { startServer } from 'starfold';
          const server = await startServer({ args: ['--audio-enabled=false'] });
          try {
            const shot = await server.client().screenshot();
            console.log('node', server.url, shot.size);
            if (shot.size[0] !== 1280 || shot.size[1] !== 800) process.exitCode = 1;
          } finally {
            await server.close();
          }
          EOF
          (cd app && node smoke.mjs)
          if [ "$LINUX_WHEELS" = 0 ]; then
            echo "LINUX_WHEELS=0: no Linux platform wheel; the pure wheel installed, binary check skipped"
            exit 0
          fi
          venv/bin/python -c '
          import starfold
          with starfold.start_server(args=["--audio-enabled=false"]) as server:
              shot = server.client().screenshot()
              print("python", server.url, shot.size)
              assert shot.size == (1280, 800)
          '

  # The release job's checks on every run, a dry run's too, against v<version>: x264's source staged
  # as the release would attach it, the exact file set by artifact, the checksums, the package
  # versions and that every package's binary is its archive's (not whether that version has a
  # release already). The release job runs them all again on what it downloads.
  check:
    name: Release check
    needs: [version, linux, linux-arm64, macos, windows, python, embed, native]
    runs-on: kyora-2x4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # The downloads are checked as a set first; then x264's source is staged outside dist/ and
      # joins for the full check.
      - name: The downloaded set
        env:
          RELEASE_LOOKUP: '0'
        run: .github/release/check-release.sh "v${{ needs.version.outputs.version }}" dist --downloads-only ${{ needs.version.outputs.flavour_names }}
      - name: x264's source
        run: .github/release/stage-x264-source.sh "$RUNNER_TEMP/x264-source"
      - name: Check the release files
        env:
          RELEASE_LOOKUP: '0'
        run: .github/release/check-release.sh "v${{ needs.version.outputs.version }}" dist "$RUNNER_TEMP/x264-source" ${{ needs.version.outputs.flavour_names }}
      # Whenever the release job won't run (anything but a pushed tag), x264's source is uploaded
      # too, so the run's download is the whole release set; on a pushed tag the release job's
      # download holds only the build artifacts.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || github.ref_type != 'tag'
        with:
          name: dry-run-x264-source-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/x264-source/
          retention-days: 30
          if-no-files-found: error

  # Only a pushed v* tag: a branch push (whatever its name), a manual run or anything else skips it.
  # A re-run ("Re-run failed jobs" of the tag's run, never a new build) finds the release it made
  # and completes it: publish.sh uploads what is missing and checks the rest against the build.
  release:
    name: GitHub release
    needs:
      - version
      - linux
      - linux-arm64
      - macos
      - windows
      - python
      - embed
      - native
      - install
      - check
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: kyora-8x16
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          # History and tags, to find the previous release's tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: The downloaded set
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/check-release.sh "$GITHUB_REF_NAME" dist --downloads-only ${{ needs.version.outputs.flavour_names }}
      - name: x264's source
        run: .github/release/stage-x264-source.sh "$RUNNER_TEMP/x264-source"
      # Before anything is created: the tag names Cargo.toml's version, which pyproject.toml and
      # packages/starfold/package.json declare too; the downloads, then with x264's source joined,
      # are exactly the expected files and every checksum checks; the packages carry the version
      # and their archive's binary; and the tag has no release yet, except on a re-run of this job.
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RESUME: ${{ github.run_attempt > 1 && '1' || '0' }}
        run: .github/release/check-release.sh "$GITHUB_REF_NAME" dist "$RUNNER_TEMP/x264-source" ${{ needs.version.outputs.flavour_names }}
      # Created for the commit every job built, while the tag names it; the tag is read again after.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > x264-notes.md <<'NOTES'
          ## Downloads

          `starfold-x264-<version>-<platform>` binaries link x264 and are GPL-2.0-or-later as a combined work.
          `starfold-<version>-<platform>` binaries link libaom and are distributed under MIT. Each archive's
          `licenses/` has the texts of what it includes; that is GCC's runtime code (GPL-3.0 with the GCC Runtime
          Library Exception) on Linux and Windows, and glibc's startup files (LGPL-2.1, with permission to link
          them) on Linux. Every file has a `.sha256` beside it, and the README's Install section lists what each
          platform needs at run time. The Python SDK (sdist and wheel) and the embeddable web client
          (`starfold-web-embed-<version>.tgz`) are attached too, and so are the packages that carry the
          default binary, exactly as npm and PyPI get them: the `@starfold/server-<platform>` npm tarballs
          with the TypeScript SDK `starfold-<version>.tgz`, and the Python SDK's platform wheels.

          ## x264 source

          A build with x264 (`--features x264`) is GPL-2.0-or-later as a combined work; a default build
          has no x264.
          The source of each x264 the x264 builds link is attached (see `third_party/x264/README.md`):
          - Linux: Ubuntu 24.04's `x264 2:0.164.3108+git31e19f9-1` (`.orig.tar.gz`, `.debian.tar.xz`, `.dsc`),
            upstream commit 31e19f92f00c7003fa115047ce50978bc98c3a0d.
          - Windows (vcpkg) and macOS (Homebrew): upstream r3222, commit b35605ace3ddf7c1a5d67a2eb553f034aef41d55
            (`x264-b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.gz`). vcpkg 2026.10.16 builds it with the patches in
            `vcpkg-2026.10.16-ports-x264.tar.gz`; Homebrew builds it unpatched.
          NOTES
          .github/release/publish.sh "$GITHUB_REF_NAME" '${{ needs.version.outputs.commit }}' x264-notes.md dist ${{ needs.version.outputs.flavour_names }}

  # The registries, in two jobs each. The dry-run jobs (crates, npm, pypi) run after the release
  # job on every run: after it succeeded on a pushed v* tag, and on any other run, where it is
  # skipped (a manual run on a tag included); a pushed tag whose release didn't succeed runs none.
  # The publish jobs run only after the release job and their dry run succeeded, and are the only
  # jobs with `id-token: write`: trusted publishing, where the registry trusts this repository's
  # release.yml and exchanges the job's OIDC token for a short-lived one, so once crates.io's
  # bootstrap token is deleted, no registry secret exists. They
  # build nothing, so no build script or dependency runs where a token can be had. Each declares
  # its registry's environment (`crates`, `npm`, `pypi`), which that registry's trusted publishers
  # name and the repository limits to v* tags (RELEASING.md), so a branch that edits this file
  # can't publish, and a job in one environment can't read another's secrets. They need the
  # release job to have succeeded, and it runs only on a pushed v* tag, so a dry run skips them
  # and never deploys to an environment. GitHub-hosted runners: npm's trusted publishing takes
  # no self-hosted runner, and the six run alike.
  crates:
    name: crates.io dry run (starfold-aom-sys, starfold)
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && (github.event_name != 'push' || github.ref_type != 'tag'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          aptq 180 update
          aptq 720 install -y libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev cmake nasm perl esbuild
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Stages the web client, packages both crates and builds each from its .crate alone.
      - name: Dry run
        run: |
          echo "building ${{ needs.version.outputs.commit }}"
          .github/release/crates.sh dry-run
      # The staged web client, for the publish job to package without building. Only after the
      # release job, so its download of every artifact never sees this one.
      - uses: actions/upload-artifact@v4
        if: needs.release.result == 'success'
        with:
          name: crate-web-${{ needs.version.outputs.version }}
          path: crates/starfold-server/web/
          retention-days: 30
          if-no-files-found: error

  crates-publish:
    name: crates.io publish
    needs: [version, release, crates]
    if: needs.release.result == 'success'
    environment: crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: crate-web-${{ needs.version.outputs.version }}
          path: crates/starfold-server/web
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Until both crates exist and trust this workflow, the environment secret
      # CRATES_IO_BOOTSTRAP_TOKEN (RELEASING.md) publishes them; once it is deleted, trusted
      # publishing does. Only this job names the secret, and only a job declaring the `crates`
      # environment, on a v* tag, can read it.
      - name: Credentials
        id: which
        env:
          HAS_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN != '' }}
        run: |
          if [ "$HAS_BOOTSTRAP_TOKEN" = true ]; then
            echo "crates.io: bootstrap token"
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "crates.io: trusted publishing"
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          fi
      - name: Token
        id: auth
        if: steps.which.outputs.mode == 'trusted'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.which.outputs.mode == 'bootstrap' && secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: .github/release/crates.sh publish

  # npm gets six packages, all at the release version: the four @starfold/server-* (the default
  # binary per platform), starfold (the TypeScript SDK, which pins those four as optional
  # dependencies) and @starfold/web (the embeddable client).
  npm:
    name: npm dry run (starfold, @starfold/server-*, @starfold/web)
    needs: [version, embed, native, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.embed.result == 'success' && needs.native.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && (github.event_name != 'push' || github.ref_type != 'tag'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starfold-web-embed-${{ needs.version.outputs.version }}
          path: dist/web
      - uses: actions/download-artifact@v4
        with:
          name: starfold-npm-${{ needs.version.outputs.version }}
          path: dist/npm
      # Trusted publishing needs npm 11.5.1 or newer and Node 22.14.0 or newer
      # (https://docs.npmjs.com/trusted-publishers).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: npm install -g npm@11.6.2 && npm --version
      # The tarballs the release attached; each package.json must name this repository, which npm
      # compares with the workflow's before it accepts the token.
      - name: Dry run
        working-directory: dist
        run: |
          set -euo pipefail
          (cd web && sha256sum -c -- *.sha256)
          (cd npm && sha256sum -c -- *.sha256)
          tarballs=(npm/starfold-server-*-"$VERSION".tgz "npm/starfold-$VERSION.tgz" "web/starfold-web-embed-$VERSION.tgz")
          [ ${#tarballs[@]} = 6 ] || { echo "::error::${#tarballs[@]} tarballs, not 6: ${tarballs[*]}"; exit 1; }
          for t in "${tarballs[@]}"; do
            tar -xzOf "$t" package/package.json | python3 -I -c '
          import json, sys
          p, want, version = json.load(sys.stdin), f"git+https://github.com/{sys.argv[1]}.git", sys.argv[2]
          got, have = p.get("repository", {}).get("url"), p["version"]
          print(p["name"], have, got)
          if got != want:
              sys.exit(f"repository.url is {got!r}, not {want!r}")
          if have != version:
              sys.exit(f"version {have!r}, not {version!r}")
          ' "$GITHUB_REPOSITORY" "$VERSION"
            npm publish "./$t" --access public --dry-run
          done

  npm-publish:
    name: npm publish
    needs: [version, release, npm]
    if: needs.release.result == 'success'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # npm-has.sh only, so no file of the repository (an .npmrc, say) is where npm reads it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github/release/npm-has.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: starfold-web-embed-${{ needs.version.outputs.version }}
          path: dist/web
      - uses: actions/download-artifact@v4
        with:
          name: starfold-npm-${{ needs.version.outputs.version }}
          path: dist/npm
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: npm install -g npm@11.6.2 && npm --version
      # A version npm lists already (a re-run) is skipped, one it doesn't is published; a registry
      # that doesn't answer with the package's versions fails the job. The four server packages go
      # first, and starfold only once npm lists all four at the version (an install of starfold
      # resolves its platform's one then); @starfold/web last. No --tag: npm publish tags `latest`
      # by default (`tag`, default "latest": https://docs.npmjs.com/cli/v11/commands/npm-publish),
      # so `latest` moves from the 0.0.1 placeholders to this version.
      - name: Publish
        working-directory: dist
        run: |
          set -euo pipefail
          (cd web && sha256sum -c -- *.sha256)
          (cd npm && sha256sum -c -- *.sha256)
          name_of() { tar -xzOf "$1" package/package.json | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["name"])'; }
          has() { ../.github/release/npm-has.sh "$1" "$VERSION" || echo failed; }
          publish() {
            local name
            name=$(name_of "$1")
            case $(has "$name") in
            present) echo "$name@$VERSION is on npm already" ;;
            absent) npm publish "./$1" --access public ;;
            *) echo "::error::npm-has.sh gave no answer for $name"; exit 1 ;;
            esac
          }
          servers=(npm/starfold-server-*-"$VERSION".tgz)
          [ ${#servers[@]} = 4 ] || { echo "::error::${#servers[@]} server packages, not 4"; exit 1; }
          for t in "${servers[@]}"; do publish "$t"; done
          for t in "${servers[@]}"; do
            name=$(name_of "$t")
            for _ in $(seq 20); do
              [ "$(has "$name")" = present ] && break
              sleep 15
            done
            [ "$(has "$name")" = present ] || { echo "::error::npm doesn't list $name@$VERSION; starfold is not published without it"; exit 1; }
            echo "$name@$VERSION is on npm"
          done
          publish "npm/starfold-$VERSION.tgz"
          publish "web/starfold-web-embed-$VERSION.tgz"

  # PyPI gets the sdist, the pure wheel and the platform wheels (pip prefers a platform wheel
  # where one fits, else the pure one, the client alone).
  pypi:
    name: PyPI dry run (Python SDK, platform wheels)
    needs: [version, python, native, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.python.result == 'success' && needs.native.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && (github.event_name != 'push' || github.ref_type != 'tag'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starfold-python-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: starfold-wheels-${{ needs.version.outputs.version }}
          path: dist
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      # The files the release attached, without their .sha256 files.
      - name: Dry run
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c -- *.sha256)
          mkdir pypi
          cp dist/*.whl "dist/starfold-$VERSION.tar.gz" pypi/
          want=$((LINUX_WHEELS == 1 ? 6 : 4))
          ls -l pypi
          n=$(find pypi -type f | wc -l)
          [ "$n" = "$want" ] || { echo "::error::$n files for PyPI, not $want"; exit 1; }
          uvx twine@6.2.0 check --strict pypi/*

  pypi-publish:
    name: PyPI publish
    needs: [version, release, pypi]
    if: needs.release.result == 'success'
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starfold-python-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: starfold-wheels-${{ needs.version.outputs.version }}
          path: dist
      - name: The sdist and the wheels
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c -- *.sha256)
          mkdir pypi
          cp dist/*.whl "dist/starfold-$VERSION.tar.gz" pypi/
          want=$((LINUX_WHEELS == 1 ? 6 : 4))
          ls -l pypi
          n=$(find pypi -type f | wc -l)
          [ "$n" = "$want" ] || { echo "::error::$n files for PyPI, not $want"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/
          skip-existing: true
