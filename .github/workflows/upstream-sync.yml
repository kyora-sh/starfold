name: Upstream sync

# Opens or updates one pull request from sync/upstream with tembo/voxl's new main
# commits (.github/scripts/upstream-sync.sh). Never pushes main.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      max_commits:
        description: Upstream commits to apply in this run (scheduled runs apply 1)
        type: number
        default: 1

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: kyora-8x16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild sync/upstream
        id: sync
        env:
          SYNC_MAX_COMMITS: ${{ inputs.max_commits }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/scripts/upstream-sync.sh https://github.com/tembo/voxl.git "$RUNNER_TEMP/body.md"
      - name: Open or update the pull request
        if: steps.sync.outputs.status == 'pushed' || steps.sync.outputs.status == 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head sync/upstream --title 'chore: upstream sync (tembo/voxl)' --body-file "$RUNNER_TEMP/body.md"
          fi
      # Pushes and pull requests made with GITHUB_TOKEN start no workflows; a dispatch does.
      # Also on an unchanged branch whose head has no CI run yet (a dispatch that failed).
      - name: Run CI on sync/upstream
        if: steps.sync.outputs.status == 'pushed' || steps.sync.outputs.status == 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.sync.outputs.head }}
        run: |
          runs=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --json databaseId --jq length)
          if [ "$runs" = 0 ]; then
            gh workflow run ci.yml --ref sync/upstream
          fi
