name: CI

# Everything runs on kyora runners. macOS runs on pushes to main and by hand; Windows is
# checked by cross-compiling clippy on Linux (no desktop smoke test).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      encoder_bench:
        description: Also run the per-codec encoder bench on macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: '1.93.0'
  # x264 is pinned per platform: Ubuntu 24.04's package (upstream 31e19f92, r3108) on Linux,
  # vcpkg's port at VCPKG_BASELINE and Homebrew's formula (upstream b35605ac, r3222) elsewhere.
  LIBX264_DEB: 'libx264-dev=2:0.164.3108+git31e19f9-1'
  BREW_X264: 'x264 r3222'

jobs:
  web:
    name: Web (oxfmt, oxlint, tsc, bun test)
    runs-on: kyora-8x16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

  python:
    name: Python (ruff, pytest)
    runs-on: kyora-8x16
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/starfold
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      - run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check
      - name: Lint
        run: uv run --locked ruff check
      # Unit tests; the Xvfb integration test skips without STARFOLD_BIN.
      - name: Test
        run: uv run --locked pytest

  upstream-sync:
    name: Upstream sync script
    runs-on: kyora-8x16
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/upstream-sync-test.sh

  rust:
    name: Rust (rustfmt, clippy, test)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: x264 source hashes
        working-directory: third_party/x264
        run: sha256sum -c --quiet SHA256SUMS && sha512sum -c --quiet SHA512SUMS
      # x264, libyuv, Opus, PulseAudio and xcb for linking, libclang for x264's bindings,
      # esbuild for build.rs.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev esbuild; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests, including the Linux-only ones (dynamic resolution).
      - name: Test
        run: cargo test --locked

  openh264:
    name: Rust with OpenH264 (clippy, test)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # As above, plus nasm for OpenH264.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev nasm esbuild; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-openh264-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-openh264-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      # Both encoders, then the build without x264 (BSD-licensed dependencies only).
      - name: Clippy
        run: |
          cargo clippy --features openh264 --all-targets --locked -- -D warnings
          cargo clippy --no-default-features --features openh264 --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --features openh264 --locked
          cargo test --no-default-features --features openh264 --locked

  openh264-cisco:
    name: Rust with Cisco's OpenH264 binary (clippy, test, startup)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # As the OpenH264 job (the tests' own OpenH264 is built from source), plus Xvfb.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev nasm esbuild xvfb; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-openh264-cisco-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-openh264-cisco-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      # Without x264, then beside it.
      - name: Clippy
        run: |
          cargo clippy --no-default-features --features openh264-cisco --all-targets --locked -- -D warnings
          cargo clippy --features openh264-cisco --all-targets --locked -- -D warnings
      # No library given: the tests encode with the dev-dependency's OpenH264.
      - name: Test
        run: cargo test --no-default-features --features openh264-cisco --locked
      # The two OpenH264 features refuse to build together.
      - name: openh264 with openh264-cisco
        run: |
          if cargo check --no-default-features --features openh264,openh264-cisco --locked 2> "$RUNNER_TEMP/both.log"; then
            echo "::error::openh264 and openh264-cisco built together"; exit 1
          fi
          grep -q "exclude each other" "$RUNNER_TEMP/both.log" || { cat "$RUNNER_TEMP/both.log"; exit 1; }
      # The binary contains no OpenH264, and without a library it does not start.
      - name: No OpenH264 without a library
        run: |
          cargo build --no-default-features --features openh264-cisco --locked
          # OpenH264's own C entry point, not the binding's Rust methods of the same name.
          nm --defined-only target/debug/starfold > "$RUNNER_TEMP/syms.txt"
          [ -s "$RUNNER_TEMP/syms.txt" ] || { echo "::error::nm printed no symbols"; exit 1; }
          if grep -Eq ' [A-Za-z] WelsCreateSVCEncoder$' "$RUNNER_TEMP/syms.txt"; then
            echo "::error::the binary contains OpenH264"; exit 1
          fi
          target/debug/starfold --version
          rc=0
          timeout 60 target/debug/starfold --enable-basic-auth=false --audio-enabled=false --port=6902 > "$RUNNER_TEMP/nolib.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/nolib.log"
          [ "$rc" = 2 ] || { echo "::error::exit $rc, not 2"; exit 1; }
          grep -q "no OpenH264 library" "$RUNNER_TEMP/nolib.log"
      # An application embedding this build that also uses OpenH264 compiled from source, so
      # Cargo builds openh264-sys2 with the source encoder for starfold too. That encoder is in
      # the binary, since the application calls it; what must hold is that starfold's code
      # never refers to it. In the debug build each function keeps its own calls, and
      # referrers.awk follows calls, jumps and addresses taken in code, named or through GOT
      # slots, back from OpenH264's C entry points (not references held only in other data). The
      # application's own call must show up, or the check sees nothing. Without a library,
      # starfold in that binary still does not start.
      - name: Embedded beside OpenH264 from source
        run: |
          cp Cargo.lock .github/fixtures/embed-source/Cargo.lock
          cd .github/fixtures/embed-source
          cargo build
          cargo tree -e features -i openh264-sys2 > "$RUNNER_TEMP/embed-tree.txt"
          grep -q 'openh264-sys2 feature "source"' "$RUNNER_TEMP/embed-tree.txt" || { cat "$RUNNER_TEMP/embed-tree.txt"; echo "::error::openh264-sys2 is not built with its source encoder here"; exit 1; }
          bin=target/debug/embed-source
          nm --defined-only "$bin" > "$RUNNER_TEMP/embed-syms.txt"
          grep -Eq ' [A-Za-z] WelsCreateSVCEncoder$' "$RUNNER_TEMP/embed-syms.txt" || { echo "::error::the application's source encoder is not in the binary"; exit 1; }
          objdump -d --no-show-raw-insn "$bin" > "$RUNNER_TEMP/embed.dis"
          [ -s "$RUNNER_TEMP/embed.dis" ] || { echo "::error::objdump printed nothing"; exit 1; }
          objdump -R "$bin" > "$RUNNER_TEMP/embed.rel"
          [ -s "$RUNNER_TEMP/embed.rel" ] || { echo "::error::objdump -R printed nothing"; exit 1; }
          awk -f referrers.awk "$RUNNER_TEMP/embed.rel" "$RUNNER_TEMP/embed.dis" > "$RUNNER_TEMP/embed-refs.txt"
          grep -q own_encoder "$RUNNER_TEMP/embed-refs.txt" || { echo "::error::the check does not see the application's own call"; exit 1; }
          if grep -E '[^0-9]8starfold|\$LT\$starfold\.\.' "$RUNNER_TEMP/embed-refs.txt"; then
            echo "::error::starfold refers to OpenH264 compiled from source"; exit 1
          fi
          "$bin" --own-encoder
          rc=0
          timeout 60 "$bin" --enable-basic-auth=false --audio-enabled=false --port=6903 > "$RUNNER_TEMP/embed.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/embed.log"
          [ "$rc" = 2 ] || { echo "::error::exit $rc, not 2"; exit 1; }
          grep -q "no OpenH264 library" "$RUNNER_TEMP/embed.log"
      # Cisco's own file, fetched from Cisco and checked against the pin: every library test
      # runs on it (the_library_tests_run_on asserts 2.6), with the swap and name-reuse tests.
      # Then the server starts with it, from a plain build of the feature: the binary
      # `cargo test` builds also links the tests' OpenH264 (the dev-dependency's source
      # feature), so this step builds its own and checks that one, and that the library is
      # mapped from the sealed memfd, not from the file.
      - name: On Cisco's OpenH264
        run: |
          lib=$(scripts/fetch-openh264.sh "$RUNNER_TEMP/openh264")
          STARFOLD_OPENH264_LIB="$lib" cargo test --no-default-features --features openh264-cisco --locked
          cargo build --no-default-features --features openh264-cisco --locked
          nm --defined-only target/debug/starfold > "$RUNNER_TEMP/syms.txt"
          [ -s "$RUNNER_TEMP/syms.txt" ] || { echo "::error::nm printed no symbols"; exit 1; }
          if grep -Eq ' [A-Za-z] WelsCreateSVCEncoder$' "$RUNNER_TEMP/syms.txt"; then
            echo "::error::the binary contains OpenH264"; exit 1
          fi
          BENCH_DISPLAY=:99 bench/env/xvfb.sh > /dev/null 2>&1 &
          for _ in $(seq 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          log=$RUNNER_TEMP/cisco.log
          DISPLAY=:99 RUST_LOG=info target/debug/starfold --openh264-lib="$lib" --port=6901 --enable-basic-auth=false --audio-enabled=false > "$log" 2>&1 &
          pid=$!
          up() { grep -q 'listening on' "$log" && grep -q 'offering H264 from openh264:' "$log"; }
          for _ in $(seq 60); do up && break; kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          sleep 3
          cut -c1-240 "$log" || true
          ok=1
          up && grep -qF 'OpenH264 Video Codec provided by Cisco Systems, Inc.' "$log" && kill -0 $pid 2>/dev/null || ok=0
          cat "/proc/$pid/maps" > "$RUNNER_TEMP/maps.txt" || ok=0
          grep -q '/memfd:starfold-openh264' "$RUNNER_TEMP/maps.txt" || { echo "::error::no mapping of the sealed memfd"; ok=0; }
          if grep -qF "$lib" "$RUNNER_TEMP/maps.txt"; then echo "::error::$lib itself is mapped"; ok=0; fi
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          [ $ok = 1 ] || { echo "::error::starfold did not start on Cisco's OpenH264"; exit 1; }

  bench-arms:
    name: Rust with the svt-av1 and x265 bench arms (clippy, test, startup)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The Rust job's libraries, plus the arms' build tools, x265 as bench/arms/libs.sh takes it
      # (Ubuntu's package) and Xvfb for the startup check.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev esbuild build-essential cmake nasm yasm pkg-config libx265-dev xvfb; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - id: svt-av1
        uses: actions/cache@v4
        with:
          path: ~/arm-libs
          key: arm-libs-svt-av1-${{ runner.os }}-${{ hashFiles('bench/arms/libs.sh') }}
      # libs.sh's pinned release, checked against its tag's commit.
      - name: SVT-AV1
        if: steps.svt-av1.outputs.cache-hit != 'true'
        run: bash bench/arms/libs.sh svt-av1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-arms-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-bench-arms-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Clippy
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo clippy --features svt-av1,x265 --all-targets --locked -- -D warnings
      - name: Test
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo test --features svt-av1,x265 --locked
      # Each arm with a preset of its own must open its encoder and reach "listening on".
      - name: Startup on Xvfb
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo build --features svt-av1,x265 --locked
          BENCH_DISPLAY=:99 bench/env/xvfb.sh >/dev/null 2>&1 &
          for _ in $(seq 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          for arm in svt-av1:12 x265:ultrafast; do
            enc=${arm%%:*} preset=${arm#*:} log=$RUNNER_TEMP/$enc.log
            DISPLAY=:99 RUST_LOG=info target/debug/starfold --encoder="$enc" --preset="$preset" --port=6901 --enable-basic-auth=false --audio-enabled=false > "$log" 2>&1 &
            pid=$!
            up() { grep -q 'listening on' "$log" && grep -q "offering .* from $enc:" "$log"; }
            for _ in $(seq 60); do up && break; kill -0 $pid 2>/dev/null || break; sleep 0.5; done
            sleep 3
            grep -v '^Svt' "$log" | cut -c1-240 || true
            ok=1
            up && kill -0 $pid 2>/dev/null || ok=0
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            [ $ok = 1 ] || { echo "::error::--encoder=$enc --preset=$preset did not start"; exit 1; }
          done

  musl:
    name: Linux musl (clippy)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Checked, not linked: musl-gcc for the C dependencies, the host g++ for OpenH264's C++,
      # x264's headers and libclang for its bindings.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev nasm esbuild musl-tools g++; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      # Then openh264-cisco, which starfold doesn't load with musl: it builds, without OpenH264.
      - name: Clippy
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: g++
        run: |
          cargo clippy --target x86_64-unknown-linux-musl -p starfold-server --all-targets --locked -- -D warnings
          cargo clippy --target x86_64-unknown-linux-musl -p starfold-server --features openh264-cisco --locked -- -D warnings

  windows:
    name: Windows (clippy, cross-compiled on Linux)
    runs-on: kyora-8x16
    timeout-minutes: 45
    env:
      VCPKG_BASELINE: 2026.10.16
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKGRS_TRIPLET: x64-mingw-static
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: MinGW, NASM and vcpkg's build tools
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y mingw-w64 nasm cmake ninja-build pkg-config libclang-dev esbuild zip unzip; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-mingw-static-${{ env.VCPKG_BASELINE }}-x264-libyuv-opus-v1
      - uses: actions/cache@v4
        with:
          path: .vcpkg-downloads
          key: vcpkg-downloads-${{ env.VCPKG_BASELINE }}-v1
      - name: x264, libyuv and Opus (vcpkg)
        run: |
          mkdir -p .vcpkg-cache .vcpkg-downloads
          retry() { for i in 1 2 3; do "$@" && return; [ "$i" = 3 ] || sleep $((i * 30)); done; return 1; }
          retry git clone --quiet --depth 1 --branch "$VCPKG_BASELINE" https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          retry "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          retry "$VCPKG_ROOT/vcpkg" install x264 libyuv opus --triplet "$VCPKGRS_TRIPLET"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-gnu-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-gnu-${{ env.RUST_TOOLCHAIN }}-
      # Then openh264-cisco, which starfold doesn't load on Windows yet: it builds, without
      # OpenH264 (library and binary; its tests build OpenH264 from source, which this
      # cross-compile doesn't).
      - name: Clippy
        run: |
          cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings
          cargo clippy --target x86_64-pc-windows-gnu --features openh264-cisco --locked -- -D warnings

  macos:
    name: macOS (rustfmt, clippy, test)
    if: github.event_name != 'pull_request'
    runs-on: kyora-macos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      # The runner image may not have Homebrew yet.
      - name: Homebrew
        run: |
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          brew=$(command -v brew || echo /opt/homebrew/bin/brew)
          prefix=$("$brew" --prefix)
          {
            echo "HOMEBREW_PREFIX=$prefix"
            echo "HOMEBREW_CELLAR=$prefix/Cellar"
            echo "HOMEBREW_REPOSITORY=$("$brew" --repository)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      # x264 and Opus for linking, esbuild for build.rs (libyuv and PulseAudio are Linux-only).
      - run: |
          brew install x264 opus pkgconf esbuild
          [ "$(brew list --versions x264)" = "$BREW_X264" ] || { echo "::error::Homebrew has $(brew list --versions x264), pinned $BREW_X264"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --features openh264-cisco --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # What the startup probe finds on this host's hardware encoders.
      - name: Encoder probe
        run: cargo test --locked --lib videotoolbox_probe -- --nocapture
      # How long VideoToolbox takes per picture at 120 fps timestamps (--high-fps).
      - name: VideoToolbox at 120 fps (optimized build)
        run: cargo test --locked --release --lib videotoolbox_encode_times -- --nocapture
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # A viewer that decodes HEVC gets VideoToolbox HEVC.
      - name: HEVC negotiation
        env:
          STARFOLD_EXPECT_HEVC: '1'
        run: cargo test --locked --lib videotoolbox_hevc_negotiated -- --nocapture
      # --encoder auto streams H.264 and HEVC from VideoToolbox.
      - name: Auto encoder
        env:
          STARFOLD_EXPECT_HW: '1'
        run: cargo test --locked --lib auto_on_this_host -- --nocapture
      - name: Encoder bench
        if: inputs.encoder_bench
        run: bash bench/vs/mac-encoders.sh 5
