name: CI
on:
  workflow_dispatch:
    inputs:
      sets:
        type: string
        default: a
      rounds:
        type: string
        default: '5'
      best:
        type: string
        default: ''
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: '1.93.0'
jobs:
  macos:
    runs-on: kyora-macos
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Homebrew
        run: |
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          brew=$(command -v brew || echo /opt/homebrew/bin/brew)
          prefix=$("$brew" --prefix)
          {
            echo "HOMEBREW_PREFIX=$prefix"
            echo "HOMEBREW_CELLAR=$prefix/Cellar"
            echo "HOMEBREW_REPOSITORY=$("$brew" --repository)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      - run: brew install opus pkgconf esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: VT floor
        env:
          SETS: ${{ inputs.sets }}
          ROUNDS: ${{ inputs.rounds }}
          BEST: ${{ inputs.best }}
        run: bash bench/vs/vt-floor.sh "$SETS" "$ROUNDS" "$BEST"
