name: CI

# Everything runs on kyora runners. macOS runs on pushes to main and by hand; Windows is
# checked by cross-compiling clippy on Linux (no desktop smoke test).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      encoder_bench:
        description: Also run the per-codec encoder bench on macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: '1.93.0'
  # x264 is pinned per platform: Ubuntu 24.04's package (upstream 31e19f92, r3108) on Linux,
  # vcpkg's port at VCPKG_BASELINE and Homebrew's formula (upstream b35605ac, r3222) elsewhere.
  LIBX264_DEB: 'libx264-dev=2:0.164.3108+git31e19f9-1'
  BREW_X264: 'x264 r3222'

jobs:
  web:
    name: Web (oxfmt, oxlint, tsc, bun test)
    runs-on: kyora-8x16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      # The embeddable client (packages/web/src/embed), packed per commit; the served page's
      # bundle stays build.rs's. Named by github.sha, the commit this job checked out and
      # built: on a pull request that is its merge commit with main, not the head.
      - name: Embeddable client package
        env:
          SHA: ${{ github.sha }}
        run: |
          sudo timeout -k 10 300 env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 update
          sudo timeout -k 10 300 env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 install -y esbuild
          mkdir -p "$RUNNER_TEMP/embed"
          bash packages/web/embed/pack.sh "$SHA" "$RUNNER_TEMP/embed"
          tar -tzf "$RUNNER_TEMP/embed/starfold-web-embed-$SHA.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: starfold-web-embed-${{ github.sha }}
          path: ${{ runner.temp }}/embed/starfold-web-embed-*.tgz
          retention-days: 90
          if-no-files-found: error

  python:
    name: Python (ruff, pytest)
    runs-on: kyora-8x16
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/starfold
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.8
      - run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check
      - name: Lint
        run: uv run --locked ruff check
      # Unit tests; the Xvfb integration test skips without STARFOLD_BIN.
      - name: Test
        run: uv run --locked pytest

  upstream-sync:
    name: Upstream sync script
    runs-on: kyora-8x16
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/upstream-sync-test.sh

  rust:
    name: Rust (rustfmt, clippy, test)
    runs-on: kyora-8x16
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # libyuv, Opus, PulseAudio and xcb for linking, cmake, nasm and perl to build libaom,
      # libclang for its bindings, esbuild for build.rs, Xvfb for the tests that start the
      # server, bindfs for the one that needs a FUSE mount.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev cmake nasm perl esbuild xvfb bindfs; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests, including the Linux-only ones (dynamic resolution).
      # Lets the FUSE test change /etc/fuse.conf and /dev/fuse for its run (tests/unix_socket.rs).
      - name: Test
        env:
          STARFOLD_TEST_SYSTEM_FUSE: '1'
        run: cargo test --locked

  x264:
    name: Rust with x264 (clippy, test)
    runs-on: kyora-8x16
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: x264 source hashes
        working-directory: third_party/x264
        run: sha256sum -c --quiet SHA256SUMS && sha512sum -c --quiet SHA512SUMS
      # As above, plus x264 and ffmpeg, which decodes what the x264 tests encode.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y "$LIBX264_DEB" libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev cmake nasm perl ffmpeg esbuild xvfb bindfs; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-x264-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-x264-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Clippy
        run: |
          cargo clippy --features x264 --all-targets --locked -- -D warnings
          cargo clippy -p starfold-server --all-targets --locked --no-default-features --features x264 -- -D warnings
      # The x264 tests fail rather than skip without ffmpeg. Lets the FUSE test change
      # /etc/fuse.conf and /dev/fuse for its run (tests/unix_socket.rs).
      - name: Test
        env:
          STARFOLD_REQUIRE_FFMPEG: '1'
          STARFOLD_TEST_SYSTEM_FUSE: '1'
        run: cargo test --features x264 --locked

  bench-arms:
    name: Rust with the svt-av1 and x265 bench arms (clippy, test, startup)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The Rust job's libraries, plus the arms' build tools, x265 as bench/arms/libs.sh takes it
      # (Ubuntu's package) and Xvfb for the startup check.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev esbuild build-essential cmake nasm yasm perl pkg-config libx265-dev xvfb bindfs; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - id: svt-av1
        uses: actions/cache@v4
        with:
          path: ~/arm-libs
          key: arm-libs-svt-av1-${{ runner.os }}-${{ hashFiles('bench/arms/libs.sh') }}
      # libs.sh's pinned release, checked against its tag's commit.
      - name: SVT-AV1
        if: steps.svt-av1.outputs.cache-hit != 'true'
        run: bash bench/arms/libs.sh svt-av1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-arms-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-bench-arms-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Clippy
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo clippy --features svt-av1,x265 --all-targets --locked -- -D warnings
      # Lets the FUSE test change /etc/fuse.conf and /dev/fuse for its run (tests/unix_socket.rs).
      - name: Test
        env:
          STARFOLD_TEST_SYSTEM_FUSE: '1'
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo test --features svt-av1,x265 --locked
      # Each arm with a preset of its own must open its encoder and reach "listening on".
      - name: Startup on Xvfb
        run: |
          source <(bash bench/arms/libs.sh --env)
          cargo build --features svt-av1,x265 --locked
          BENCH_DISPLAY=:99 bench/env/xvfb.sh >/dev/null 2>&1 &
          for _ in $(seq 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          for arm in svt-av1:12 x265:ultrafast; do
            enc=${arm%%:*} preset=${arm#*:} log=$RUNNER_TEMP/$enc.log
            DISPLAY=:99 RUST_LOG=info target/debug/starfold --encoder="$enc" --preset="$preset" --port=6901 --enable-basic-auth=false --audio-enabled=false > "$log" 2>&1 &
            pid=$!
            up() { grep -q 'listening on' "$log" && grep -q "offering .* from $enc:" "$log"; }
            for _ in $(seq 60); do up && break; kill -0 $pid 2>/dev/null || break; sleep 0.5; done
            sleep 3
            grep -v '^Svt' "$log" | cut -c1-240 || true
            ok=1
            up && kill -0 $pid 2>/dev/null || ok=0
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            [ $ok = 1 ] || { echo "::error::--encoder=$enc --preset=$preset did not start"; exit 1; }
          done
          # --base-path through the real binary, including the cases that serve (they need
          # this display; the Test step runs only the ones that stop).
          DISPLAY=:99 STARFOLD_SERVE_TESTS=1 cargo test --features svt-av1,x265 --locked --test base_path_cli

  libaom:
    name: libaom (clippy, test, static link, startup, aarch64 and Windows builds)
    runs-on: kyora-8x16
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: libaom's commit
        run: test "$(git -C crates/starfold-aom-sys/aom rev-parse HEAD)" = b141d9c45db236335351c8a4b2a14b3ade27c937
      # The Rust job's libraries, and for the cross builds the aarch64 and MinGW compilers and
      # qemu to run the aarch64 tests.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev esbuild cmake nasm perl xvfb bindfs gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user mingw-w64; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-libaom-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-libaom-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      # The server with libaom, the default, is the Rust job's.
      - name: Clippy
        run: cargo clippy -p starfold-aom-sys --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p starfold-aom-sys --locked
      # The binary carries libaom's encoder, statically; the library built has no decoder.
      - name: libaom linked statically
        run: |
          cargo build --locked
          ldd target/debug/starfold > "$RUNNER_TEMP/ldd.txt"
          if grep -i aom "$RUNNER_TEMP/ldd.txt"; then echo "::error::a shared libaom is linked"; exit 1; fi
          nm target/debug/starfold > "$RUNNER_TEMP/nm.txt"
          grep ' T aom_codec_av1_cx$' "$RUNNER_TEMP/nm.txt"
          for a in target/debug/build/starfold-aom-sys-*/out/lib/libstarfold_aom_*.a; do
            ar t "$a" > "$RUNNER_TEMP/objects.txt"
            grep -x 'av1_cx_iface.c.o' "$RUNNER_TEMP/objects.txt"
            if grep -E '^(av1_dx_iface|decodeframe|decodemv|decoder)\.c\.o$' "$RUNNER_TEMP/objects.txt"; then echo "::error::$a has libaom's decoder"; exit 1; fi
          done
      # --encoder libaom must open its encoder and reach "listening on".
      - name: Startup on Xvfb
        run: |
          BENCH_DISPLAY=:99 bench/env/xvfb.sh >/dev/null 2>&1 &
          for _ in $(seq 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          log=$RUNNER_TEMP/libaom.log
          DISPLAY=:99 RUST_LOG=info target/debug/starfold --encoder=libaom --port=6901 --enable-basic-auth=false --audio-enabled=false > "$log" 2>&1 &
          pid=$!
          up() { grep -q 'listening on' "$log" && grep -q "offering .* from libaom:" "$log"; }
          for _ in $(seq 60); do up && break; kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          sleep 3
          cut -c1-240 "$log" || true
          ok=1
          up && kill -0 $pid 2>/dev/null || ok=0
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          [ $ok = 1 ] || { echo "::error::--encoder=libaom did not start"; exit 1; }
      # libaom cross-compiled with its own toolchain files; the aarch64 tests run under qemu.
      - name: aarch64 (cross-compiled)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo test -p starfold-aom-sys --target aarch64-unknown-linux-gnu --locked
      - name: Windows x86_64 (cross-compiled, linked)
        run: cargo test -p starfold-aom-sys --target x86_64-pc-windows-gnu --locked --no-run

  musl:
    name: Linux musl (clippy)
    runs-on: kyora-8x16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Checked, not linked: musl-gcc for the C dependencies, the host g++ for the C++ compiler
      # libaom's cmake asks for, cmake, nasm and perl to build libaom and libclang for its bindings.
      - name: Native libraries
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y libclang-dev libyuv-dev libopus-dev libpulse-dev libxcb1-dev cmake nasm perl esbuild musl-tools g++; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Clippy
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: g++
        run: cargo clippy --target x86_64-unknown-linux-musl -p starfold-server --all-targets --locked -- -D warnings

  windows:
    name: Windows (clippy, cross-compiled on Linux)
    runs-on: kyora-8x16
    timeout-minutes: 45
    env:
      VCPKG_BASELINE: 2026.10.16
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKGRS_TRIPLET: x64-mingw-static
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: MinGW, NASM and vcpkg's build tools
        run: |
          aptq() { local limit=$1; shift; sudo timeout -k 10 "$limit" env DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          deps() { aptq 180 update && aptq 720 install -y mingw-w64 nasm cmake ninja-build perl pkg-config libclang-dev esbuild zip unzip; }
          deps || { echo "::warning::package install failed or stalled; repairing and retrying once"; sudo timeout -k 10 180 env DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true; deps; }
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-mingw-static-${{ env.VCPKG_BASELINE }}-x264-libyuv-opus-v1
      - uses: actions/cache@v4
        with:
          path: .vcpkg-downloads
          key: vcpkg-downloads-${{ env.VCPKG_BASELINE }}-v1
      - name: x264, libyuv and Opus (vcpkg)
        run: |
          mkdir -p .vcpkg-cache .vcpkg-downloads
          retry() { for i in 1 2 3; do "$@" && return; [ "$i" = 3 ] || sleep $((i * 30)); done; return 1; }
          retry git clone --quiet --depth 1 --branch "$VCPKG_BASELINE" https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          retry "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          retry "$VCPKG_ROOT/vcpkg" install x264 libyuv opus --triplet "$VCPKGRS_TRIPLET"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-gnu-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-gnu-${{ env.RUST_TOOLCHAIN }}-
      - name: Clippy
        run: |
          cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings
          cargo clippy --target x86_64-pc-windows-gnu --features x264 --all-targets --locked -- -D warnings
      # libaom cross-compiled with its MinGW toolchain file, and starfold.exe linked with it.
      - name: Linked with libaom
        run: |
          cargo build --target x86_64-pc-windows-gnu --locked
          x86_64-w64-mingw32-nm target/x86_64-pc-windows-gnu/debug/starfold.exe | grep ' T aom_codec_av1_cx$'

  macos:
    name: macOS (rustfmt, clippy, test)
    if: github.event_name != 'pull_request'
    runs-on: kyora-macos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      # The runner image may not have Homebrew yet.
      - name: Homebrew
        run: |
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          brew=$(command -v brew || echo /opt/homebrew/bin/brew)
          prefix=$("$brew" --prefix)
          {
            echo "HOMEBREW_PREFIX=$prefix"
            echo "HOMEBREW_CELLAR=$prefix/Cellar"
            echo "HOMEBREW_REPOSITORY=$("$brew" --repository)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      # x264 and Opus for linking, esbuild for build.rs (libyuv and PulseAudio are Linux-only),
      # cmake and nasm for libaom.
      - run: |
          brew install x264 opus pkgconf esbuild cmake nasm
          [ "$(brew list --versions x264)" = "$BREW_X264" ] || { echo "::error::Homebrew has $(brew list --versions x264), pinned $BREW_X264"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # libaom built from the submodule for arm64.
      - name: libaom
        run: cargo test -p starfold-aom-sys --locked
      - name: x264
        run: |
          cargo clippy --features x264 --all-targets --locked -- -D warnings
          cargo test --features x264 --locked --lib encoder
      # What the startup probe finds on this host's hardware encoders.
      - name: Encoder probe
        run: cargo test --locked --lib videotoolbox_probe -- --nocapture
      # How long VideoToolbox takes per picture at 120 fps timestamps (--high-fps).
      - name: VideoToolbox at 120 fps (optimized build)
        run: cargo test --locked --release --lib videotoolbox_encode_times -- --nocapture
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # A viewer that decodes HEVC gets VideoToolbox HEVC.
      - name: HEVC negotiation
        env:
          STARFOLD_EXPECT_HEVC: '1'
        run: cargo test --locked --lib videotoolbox_hevc_negotiated -- --nocapture
      # --encoder auto streams H.264 and HEVC from VideoToolbox.
      - name: Auto encoder
        env:
          STARFOLD_EXPECT_HW: '1'
        run: cargo test --locked --lib auto_on_this_host -- --nocapture
      - name: Encoder bench
        if: inputs.encoder_bench
        run: bash bench/vs/mac-encoders.sh 5
