# cargo-about's configuration for the licence file each release archive carries
# (.github/workflows/release.yml). The first accepted licence a crate offers is the one listed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
# starfold itself: its LICENSE is in the archive beside the binary.
private = { ignore = true }
