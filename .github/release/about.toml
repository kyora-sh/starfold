# cargo-about's configuration for the licence file each release archive carries
# (.github/workflows/release.yml). The first accepted licence a crate offers is the one listed.
accepted = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"BSL-1.0",
	"0BSD",
	"Unlicense",
]
# starfold's own crates (starfold, starfold-aom-sys): their licences are in the archive beside the
# binary and in THIRD_PARTY.md. cargo-about leaves out any crate whose `publish` lists only these
# registries, and both declare `publish = ["crates-io"]`. A dependency that declared the same would
# be left out too; about-private.sh, run before each `cargo about generate`, fails if one does.
private = { ignore = true, registries = ["crates-io"] }
