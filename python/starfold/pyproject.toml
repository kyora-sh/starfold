[project]
name = "starfold"
version = "0.4.0"
description = "Python client for starfold: screenshots, waiting for the screen, mouse and keyboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/kyora-sh/starfold"

[project.optional-dependencies]
pillow = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
